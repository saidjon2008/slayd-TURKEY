<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>튀르키예 | A Cinematic Journey</title>
    <meta
      name="description"
      content="이스탄불, 카파도키아, 파묵칼레, 안탈리아 — 튀르키예를 영화처럼 만나 보세요."
    />
    <meta name="theme-color" content="#0a0e13" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0a0e13;
        --ink: #f3ede1;
        --soft: rgba(243, 237, 225, 0.74);
        --gold: #d9b26f;
        --gold-soft: rgba(217, 178, 111, 0.38);
        --clay: #c8694a;
        --ease: cubic-bezier(0.77, 0, 0.18, 1);
        --out: cubic-bezier(0.16, 0.8, 0.2, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
        font-family: "DM Sans", "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      @media (hover: hover) {
        * {
          cursor: none !important;
        }
      }

      /* ---------- FILM LOOK ---------- */
      .grain,
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 60;
      }
      .grain {
        opacity: 0.09;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        animation: grain 1s steps(6) infinite;
      }
      @keyframes grain {
        0% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-3%, 2%);
        }
        40% {
          transform: translate(2%, -3%);
        }
        60% {
          transform: translate(-2%, -1%);
        }
        80% {
          transform: translate(3%, 3%);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      .vignette {
        background: radial-gradient(
          ellipse at center,
          transparent 60%,
          rgba(0, 0, 0, 0.42) 100%
        );
      }
      #dust {
        position: fixed;
        inset: 0;
        z-index: 26;
        pointer-events: none;
      }

      /* ---------- CURSOR ---------- */
      .cursor,
      .cdot {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 70;
        border-radius: 50%;
      }
      .cursor {
        width: 38px;
        height: 38px;
        margin: -19px 0 0 -19px;
        border: 1px solid var(--gold);
        transition:
          width 0.35s var(--out),
          height 0.35s var(--out),
          margin 0.35s var(--out),
          background 0.3s,
          border-color 0.3s;
        mix-blend-mode: difference;
      }
      .cursor.big {
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        background: rgba(217, 178, 111, 0.2);
      }
      .cursor.down {
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        background: rgba(217, 178, 111, 0.5);
      }
      .cdot {
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        background: var(--gold);
      }
      @media (hover: none) {
        .cursor,
        .cdot {
          display: none;
        }
      }

      /* ---------- LOADER ---------- */
      .loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        clip-path: inset(0);
        transition:
          clip-path 1.2s var(--ease),
          visibility 1.2s;
      }
      .loader.hide {
        clip-path: inset(0 0 100% 0);
        visibility: hidden;
      }
      .loader b {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 400;
        font-size: clamp(48px, 10vw, 120px);
        letter-spacing: -1px;
        color: var(--gold);
      }
      .loader .lb {
        width: 200px;
        height: 1px;
        background: rgba(255, 255, 255, 0.15);
        position: relative;
        overflow: hidden;
      }
      .loader .lb i {
        position: absolute;
        inset: 0;
        background: var(--gold);
        transform-origin: left;
        transform: scaleX(0);
        transition: transform 0.4s ease;
      }
      .loader small {
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--soft);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- HEADER / FOOTER / TIMELINE ---------- */
      .header {
        position: fixed;
        z-index: 30;
        top: 0;
        left: 0;
        right: 0;
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4.5%;
        background: linear-gradient(180deg, rgba(8, 11, 15, 0.55), transparent);
      }
      .brand {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .brand span {
        color: var(--gold);
      }
      .h-right {
        display: flex;
        align-items: center;
        gap: 26px;
        font-size: 11px;
        letter-spacing: 2px;
      }
      .counter {
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .counter em {
        font-style: normal;
        color: var(--gold);
      }
      .tbtn {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 10px;
        letter-spacing: 2px;
        opacity: 0.85;
        transition: opacity 0.3s;
      }
      .tbtn:hover,
      .tbtn.on {
        opacity: 1;
      }
      .tbtn.on .tag {
        color: var(--gold);
      }
      .bars {
        display: flex;
        gap: 2px;
        align-items: flex-end;
        height: 14px;
      }
      .bars i {
        width: 2px;
        height: 4px;
        background: var(--gold);
      }
      .tbtn.on .bars i {
        animation: eq 1s ease-in-out infinite;
      }
      .bars i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .bars i:nth-child(3) {
        animation-delay: 0.4s;
      }
      .bars i:nth-child(4) {
        animation-delay: 0.1s;
      }
      @keyframes eq {
        0%,
        100% {
          height: 3px;
        }
        50% {
          height: 14px;
        }
      }

      .timeline {
        position: fixed;
        z-index: 30;
        left: 2.2%;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .tl {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 0;
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--soft);
      }
      .tl i {
        display: block;
        width: 14px;
        height: 1px;
        background: currentColor;
        transition: width 0.5s var(--out);
      }
      .tl span {
        opacity: 0;
        transform: translateX(-8px);
        transition: all 0.4s var(--out);
        white-space: nowrap;
      }
      .tl:hover span,
      .tl.active span {
        opacity: 1;
        transform: none;
      }
      .tl.active {
        color: var(--gold);
      }
      .tl.active i {
        width: 38px;
      }
      .tl:hover i {
        width: 30px;
      }

      .footer {
        position: fixed;
        z-index: 30;
        left: 0;
        right: 0;
        bottom: 0;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4.5%;
        background: linear-gradient(0deg, rgba(8, 11, 15, 0.5), transparent);
      }
      .hint {
        font-size: 10px;
        letter-spacing: 2.5px;
        color: var(--soft);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .hint::before {
        content: "";
        width: 46px;
        height: 1px;
        background: var(--gold);
      }
      .ctrl {
        display: flex;
        gap: 10px;
      }
      .cbtn {
        width: 42px;
        height: 42px;
        border: 1px solid rgba(243, 237, 225, 0.45);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 15px;
        transition:
          background 0.3s,
          color 0.3s,
          border-color 0.3s;
      }
      .cbtn:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: #111;
      }
      .cbtn:focus-visible,
      .tl:focus-visible,
      .tbtn:focus-visible,
      .restart:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
      .pbar {
        position: fixed;
        z-index: 31;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 0;
        background: var(--gold);
        transition: width 1s var(--ease);
      }

      /* ---------- SLIDES ---------- */
      #stage {
        position: fixed;
        inset: 0;
      }
      .slide {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
        clip-path: var(--from, inset(100% 0 0 0));
        transition: clip-path 1.15s var(--ease);
        background: var(--bg);
      }
      /* MUHIM: faol slayd doim ko'rinadi (qora ekran xatosi shu yerda tuzatildi) */
      .slide.active,
      .slide.enter,
      .slide.under {
        visibility: visible;
      }
      .slide.active {
        clip-path: inset(0);
        z-index: 3;
      }
      .slide.under {
        clip-path: inset(0);
        z-index: 2;
      }

      .bg {
        position: absolute;
        inset: -3%;
        background: linear-gradient(135deg, #1d3a46, var(--tint, #6b5744));
        transform: translate3d(
          calc(var(--mx, 0) * -16px),
          calc(var(--my, 0) * -10px),
          0
        );
        transition: transform 0.6s ease-out;
      }
      .bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.16);
        transition: transform 12s cubic-bezier(0.2, 0.6, 0.3, 1);
      }
      .slide.active .bg img {
        transform: scale(1.02);
      }
      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(8, 11, 15, 0.78) 0%,
            rgba(8, 11, 15, 0.34) 55%,
            rgba(8, 11, 15, 0.08) 100%
          ),
          linear-gradient(0deg, rgba(8, 11, 15, 0.55), transparent 38%);
      }
      .blur .bg img,
      .place .bg img {
        filter: blur(30px) brightness(0.72) saturate(1.4);
        transform: scale(1.3);
      }
      .slide.active.blur .bg img,
      .slide.active.place .bg img {
        transform: scale(1.2);
      }
      .blur .bg::after,
      .place .bg::after {
        background: linear-gradient(
          90deg,
          rgba(8, 11, 15, 0.5),
          rgba(8, 11, 15, 0.2)
        );
      }
      .glow {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.42;
        mix-blend-mode: screen;
        background: radial-gradient(
          circle at 72% 45%,
          var(--tint, #d9b26f),
          transparent 55%
        );
      }

      /* text */
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--gold);
        margin-bottom: 24px;
      }
      .eyebrow::before {
        content: "";
        width: 40px;
        height: 1px;
        background: currentColor;
      }
      .title {
        font-family: "Noto Serif KR", serif;
        font-weight: 600;
        font-size: clamp(36px, 5.4vw, 82px);
        line-height: 1.18;
        letter-spacing: -1.5px;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.35);
      }
      .ln {
        display: block;
        overflow: hidden;
        padding: 0.04em 0.12em 0.14em 0;
        margin-bottom: -0.06em;
      }
      .w {
        display: inline-block;
        white-space: nowrap;
      }
      .ch {
        display: inline-block;
        transform: translateY(115%) rotate(7deg);
        opacity: 0;
        transition:
          transform 1s var(--out),
          opacity 0.8s ease;
        transition-delay: calc(var(--i) * 28ms + 350ms);
      }
      .slide.active .ch {
        transform: none;
        opacity: 1;
      }
      .ln.em {
        color: var(--gold);
      }
      .ln.lat {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -2px;
        font-size: 1.18em;
      }
      .ln.lat .ch {
        font-family: inherit;
      }

      .desc {
        max-width: 540px;
        margin-top: 24px;
        font-family: "Noto Sans KR", sans-serif;
        font-weight: 300;
        font-size: clamp(13px, 1.2vw, 16px);
        line-height: 2.05;
        color: var(--soft);
        word-break: keep-all;
      }
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 1s ease,
          transform 1s var(--out);
      }
      .slide.active .reveal {
        opacity: 1;
        transform: none;
      }
      .d1 {
        transition-delay: 0.3s;
      }
      .d2 {
        transition-delay: 0.6s;
      }
      .d3 {
        transition-delay: 0.85s;
      }
      .d4 {
        transition-delay: 1.1s;
      }

      /* hero */
      .hero .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px 9%;
      }
      .hero .title {
        font-size: clamp(44px, 8vw, 128px);
        line-height: 1.08;
      }
      .hero-meta {
        position: absolute;
        left: 9%;
        right: 6%;
        bottom: 128px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        font-size: 10px;
        letter-spacing: 2.5px;
        color: var(--soft);
        z-index: 3;
      }
      .hero-meta b {
        display: block;
        color: var(--ink);
        font-weight: 500;
        margin-top: 6px;
        letter-spacing: 1.5px;
        font-size: 12px;
      }
      .hero-meta div + div {
        text-align: right;
      }
      .ribbon {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 76px;
        z-index: 3;
        overflow: hidden;
        white-space: nowrap;
        border-top: 1px solid var(--gold-soft);
        border-bottom: 1px solid var(--gold-soft);
        padding: 10px 0;
        background: rgba(8, 11, 15, 0.35);
        backdrop-filter: blur(4px);
      }
      .ribbon div {
        display: inline-block;
        animation: slide 32s linear infinite;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 20px;
        color: var(--gold);
        letter-spacing: 2px;
      }
      .ribbon span {
        margin: 0 28px;
        color: var(--ink);
        opacity: 0.5;
      }
      @keyframes slide {
        to {
          transform: translateX(-50%);
        }
      }

      /* place */
      .place .wrap {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        align-items: center;
        gap: 6%;
        padding: 100px 9% 90px;
      }
      .place.flip .wrap {
        grid-template-columns: 0.95fr 1.05fr;
      }
      .place.flip .arch-wrap {
        order: -1;
      }
      .ghost {
        position: absolute;
        left: -1%;
        bottom: -6%;
        z-index: 1;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 600;
        font-size: clamp(150px, 24vw, 380px);
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 1px rgba(217, 178, 111, 0.3);
        transform: translateX(-5%);
        transition: transform 2.4s var(--out);
      }
      .slide.active .ghost {
        transform: none;
      }
      .place.flip .ghost {
        left: auto;
        right: -1%;
      }

      .arch-wrap {
        position: relative;
        width: min(100%, 440px);
        justify-self: center;
        margin: 0;
      }
      .arch-wrap::before {
        content: "";
        position: absolute;
        inset: -14px;
        border: 1px solid var(--gold-soft);
        border-radius: 999px 999px 0 0;
        transition: inset 1.6s var(--out);
      }
      .slide.active .arch-wrap::before {
        inset: -18px;
      }
      .arch {
        position: relative;
        width: 100%;
        height: min(64vh, 580px);
        overflow: hidden;
        border-radius: 999px 999px 0 0;
        background: linear-gradient(160deg, #33414a, var(--tint, #6b5744));
        box-shadow: 0 50px 90px -30px rgba(0, 0, 0, 0.8);
        transform: perspective(900px) rotateY(calc(var(--mx, 0) * 7deg))
          rotateX(calc(var(--my, 0) * -5deg));
        transition: transform 0.7s ease-out;
      }
      .arch img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.2);
        transition: transform 10s cubic-bezier(0.2, 0.6, 0.3, 1);
      }
      .slide.active .arch img {
        transform: scale(1.03);
      }
      .arch::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          rgba(8, 11, 15, 0.35),
          transparent 40%
        );
      }
      .arch-wrap figcaption {
        position: absolute;
        left: 50%;
        bottom: -44px;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--soft);
        white-space: nowrap;
      }

      .stats {
        display: grid;
        grid-template-columns: auto 1fr 1fr;
        gap: 34px;
        margin-top: 32px;
        padding-top: 22px;
        border-top: 1px solid var(--gold-soft);
        max-width: 600px;
      }
      .stat small {
        display: block;
        font-size: 9px;
        letter-spacing: 2.5px;
        color: var(--gold);
        margin-bottom: 8px;
      }
      .stat b {
        display: block;
        font-family: "Noto Sans KR", sans-serif;
        font-weight: 400;
        font-size: 13px;
        line-height: 1.7;
        color: var(--ink);
        word-break: keep-all;
      }
      .stat.big b {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 56px;
        line-height: 1;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      .stat.big span {
        display: block;
        margin-top: 8px;
        font-size: 10px;
        line-height: 1.6;
        color: var(--soft);
        max-width: 130px;
        word-break: keep-all;
      }

      /* map */
      .mapslide .wrap {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        align-items: center;
        gap: 3%;
        padding: 100px 7% 90px 9%;
      }
      .mapbox {
        position: relative;
        background-image: radial-gradient(
          rgba(217, 178, 111, 0.25) 1px,
          transparent 1.4px
        );
        background-size: 22px 22px;
        border: 1px solid var(--gold-soft);
        padding: 10px;
        background-color: rgba(10, 16, 22, 0.6);
        backdrop-filter: blur(4px);
      }
      .mapbox svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .outline {
        fill: rgba(217, 178, 111, 0.07);
        stroke: var(--gold);
        stroke-width: 1.2;
        stroke-linejoin: round;
        stroke-dasharray: 3000;
        stroke-dashoffset: 3000;
        transition:
          stroke-dashoffset 3s var(--ease) 0.4s,
          fill 1.5s ease 2s;
      }
      .slide.active .outline {
        stroke-dashoffset: 0;
        fill: rgba(217, 178, 111, 0.13);
      }
      .route {
        fill: none;
        stroke: var(--clay);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        transition: stroke-dashoffset 4s ease-in-out 1.6s;
      }
      .slide.active .route {
        stroke-dashoffset: 0;
      }
      .pin {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .slide.active .pin {
        opacity: 1;
      }
      .pin circle.c {
        fill: var(--bg);
        stroke: var(--gold);
        stroke-width: 2;
      }
      .pin circle.p {
        fill: none;
        stroke: var(--gold);
        stroke-width: 1;
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          r: 6;
          opacity: 0.9;
        }
        100% {
          r: 22;

  <div class="ribbon"><div>${rib}${rib}${rib}${rib}</div></div>
</section>`);

      S.push(`
<section class="slide mapslide blur" style="--tint:#2d8fb8">
  <div class="bg">${im(hero.img, "")}</div><div class="glow"></div>
  <div class="wrap">
    <div>
      <div class="eyebrow reveal d1">THE ROUTE</div>
      <h2 class="title">${split(["네 도시,", "하나의 여정"])}</h2>
      <p class="desc reveal d2">이스탄불에서 시작해 카파도키아의 하늘을 지나, 파묵칼레의 하얀 테라스를 거쳐 지중해의 안탈리아에서 끝나는 여정입니다.</p>
      <div class="route-list reveal d3"><div><b>4</b>CITIES</div><div><b>10–12</b>DAYS</div><div><b>2</b>CONTINENTS</div></div>
    </div>
    <div class="mapbox reveal d2">${mapSVG}</div>
  </div>
</section>`);

      places.forEach((p, i) => {
        S.push(`
<section class="slide place ${i % 2 ? "flip" : ""}" style="--tint:${p.tint}">
  <div class="bg">${im(p.img, p.alt)}</div><div class="glow"></div>
  <div class="ghost">${p.ghost}</div>

    <div>

        <div class="stat"><small>BEST SEASON</small><b>${p.season}</b></div>
        <div class="stat"><small>DURATION</small><b>${p.days}</b></div>
      </div>
    </div>

      <div class="arch">${im(p.img, p.alt)}</div>

    </figure>
  </div>
</section>`);
      });

      S.push(`
<section class="slide food blur" style="--tint:#c8694a">
  <div class="bg">${im(end.img, end.alt)}</div><div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow reveal d1">05 — TASTE OF TÜRKİYE</div>
    <h2 class="title">${split(["입안에서 만나는", "튀르키예"])}</h2>
    <div class="cards reveal d2">
      ${foods.map(([a, b, c], i) => `<div class="card" data-n="0${i + 1}"><em>${a}</em><strong>${b}</strong><p>${c}</p></div>`).join("")}

      S.push(`
<section class="slide phr blur" style="--tint:#4aa7b5">
  <div class="bg">${im(hero.img, hero.alt)}</div><div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow reveal d1">06 — SPEAK A LITTLE TURKISH</div>
    <h2 class="title">${split(["한마디면", "충분합니다"])}</h2>
    <div class="plist reveal d2">
      ${phrases.map(([a, b, c]) => `<div class="prow"><em>${a}</em><span>${b}<b>${c}</b></span></div>`).join("")}
    </div>
  </div>

      S.push(`
<section class="slide closing" style="--tint:#d9b26f">
  <div class="bg">${im(end.img, end.alt)}</div><div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow reveal d1">07 — THE END OF OUR JOURNEY</div>
    <h2 class="title">${split(["여행은 끝나도,", "추억은 남습니다."])}</h2>
    <p class="desc reveal d2">튀르키예는 아름다운 자연뿐만 아니라 오랜 역사와 다양한 문화를 경험할 수 있는 나라입니다. 언젠가 직접 방문하여 이 모든 풍경을 만나 보고 싶습니다. 여러분도 튀르키예에서 특별한 추억을 만들어 보세요.</p>
    <div class="cgrid reveal d3">${end.items.map(([a, b]) => `<div class="citem"><strong>${a}</strong><span>${b}</span></div>`).join("")}</div>
    <button class="restart reveal d4" id="restart">↺ 처음부터 다시 보기 · THANK YOU</button>
  </div>
</section>`);

      const stage = document.getElementById("stage");
      stage.innerHTML = S.join("");
      const slides = [...stage.querySelectorAll(".slide")];
      const total = slides.length;
      slides.forEach((s, i) => {
        s.setAttribute("role", "group");
        s.setAttribute("aria-roledescription", "slide");
        s.setAttribute("aria-label", `${i + 1} / ${total}`);
        s.inert = true;
      });

      const routeEl = document.getElementById("route");
      routeEl.style.setProperty(
        "--len",
        Math.ceil(routeEl.getTotalLength()) + 5,
      );

      const tl = document.getElementById("timeline");
      tl.innerHTML = names
        .map(
          (n, i) =>
            `<button class="tl" data-i="${i}" aria-label="${n}"><i></i><span>${String(i + 1).padStart(2, "0")} · ${n}</span></button>`,
        )
        .join("");
      const tlBtns = [...tl.children];

      /* =========================================================
   NAVIGATION
   ========================================================= */
      let cur = -1,
        busy = false,
        autoOn = false,
        autoT = null;
      const counter = document.getElementById("counter");
      const pbar = document.getElementById("pbar");

      function runCounters(sl) {
        sl.querySelectorAll("[data-count]").forEach((el) => {
          const to = +el.dataset.count,
            t0 = performance.now() + 700;
          el.textContent = "0";
          const step = (t) => {
            const p = Math.min(Math.max((t - t0) / 1900, 0), 1);
            el.textContent = Math.round(to * (1 - Math.pow(1 - p, 4)));
            if (p < 1 && slides[cur] === sl) requestAnimationFrame(step);
            else if (p >= 1) el.textContent = to;
          };
          requestAnimationFrame(step);
        });
      }

      function goTo(i) {
        if (busy || i === cur || i < 0 || i >= total) return;
        busy = true;
        const old = slides[cur],
          nw = slides[i];
        const dir = cur === -1 || i > cur ? 1 : -1;

        nw.style.setProperty(
          "--from",
          dir > 0 ? "inset(100% 0 0 0)" : "inset(0 0 100% 0)",
        );
        nw.classList.add("enter");
        void nw.offsetWidth;
        if (old) {
          old.classList.remove("active");
          old.classList.add("under");
          old.inert = true;
        }
        nw.classList.add("active");
        nw.inert = false;
        cur = i;

        counter.innerHTML = `<em>${String(i + 1).padStart(2, "0")}</em> / ${String(total).padStart(2, "0")}`;
        pbar.style.width = ((i + 1) / total) * 100 + "%";
        tlBtns.forEach((b, k) => b.classList.toggle("active", k === i));
        history.replaceState(null, "", "#" + (i + 1));
        runCounters(nw);

        clearTimeout(autoT);
        if (autoOn) autoT = setTimeout(next, 9500);

        setTimeout(() => {
          if (old) old.classList.remove("under", "enter");
          nw.classList.remove("enter");
          busy = false;
        }, 1250);
      }
      const next = () => goTo((cur + 1) % total);
      const prev = () => goTo((cur - 1 + total) % total);

      /* =========================================================
   EVENTS
   ========================================================= */
      document.getElementById("next").onclick = next;
      document.getElementById("prev").onclick = prev;
      tlBtns.forEach((b) => (b.onclick = () => goTo(+b.dataset.i)));
      document.addEventListener("click", (e) => {
        if (e.target.closest("#restart")) goTo(0);
      });
      document.getElementById("full").onclick = async () => {
        try {
          document.fullscreenElement
            ? await document.exitFullscreen()
            : await document.documentElement.requestFullscreen();
        } catch (e) {}
      };

      const autoBtn = document.getElementById("auto");
      autoBtn.onclick = () => {
        autoOn = !autoOn;
        autoBtn.classList.toggle("on", autoOn);
        document.getElementById("autoIc").textContent = autoOn ? "❚❚" : "▶";
        clearTimeout(autoT);
        if (autoOn) autoT = setTimeout(next, 9500);
      };

      document.addEventListener("keydown", (e) => {
        if (e.target.closest("button") && (e.key === " " || e.key === "Enter"))
          return;
        const k = e.key;
        if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(k)) {
          e.preventDefault();
          next();
        } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(k)) {
          e.preventDefault();
          prev();
        } else if (k === "Home") goTo(0);
        else if (k === "End") goTo(total - 1);
        else if (k === "f" || k === "F")
          document.getElementById("full").click();
        else if (k === "m" || k === "M")
          document.getElementById("sound").click();
        else if (k === "a" || k === "A") autoBtn.click();
      });

      let wl = false;
      document.addEventListener(
        "wheel",
        (e) => {
          if (wl || Math.abs(e.deltaY) < 25) return;
          wl = true;
          e.deltaY > 0 ? next() : prev();
          setTimeout(() => (wl = false), 1400);
        },
        { passive: true },
      );

      let sx = 0,
        sy = 0;
      document.addEventListener(
        "touchstart",
        (e) => {
          sx = e.changedTouches[0].clientX;
          sy = e.changedTouches[0].clientY;
        },
        { passive: true },
      );
      document.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - sx,
            dy = e.changedTouches[0].clientY - sy;
          if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
          (dx < 0 ? next : prev)();
        },
        { passive: true },
      );

      window.addEventListener("hashchange", () => {
        const n = parseInt(location.hash.slice(1), 10);
        if (n >= 1 && n <= total) goTo(n - 1);
      });

      /* ---------- Cursor, parallax, magnetic buttons ---------- */
      const cursor = document.getElementById("cursor"),
        cdot = document.getElementById("cdot");
      let tx = innerWidth / 2,
        ty = innerHeight / 2,
        cx = tx,
        cy = ty;
      document.addEventListener("mousemove", (e) => {
        tx = e.clientX;
        ty = e.clientY;
        cdot.style.transform = `translate(${tx}px,${ty}px)`;
        stage.style.setProperty(
          "--mx",
          ((tx / innerWidth - 0.5) * 2).toFixed(3),
        );
        stage.style.setProperty(
          "--my",
          ((ty / innerHeight - 0.5) * 2).toFixed(3),
        );
      });
      document.addEventListener("mouseover", (e) =>
        cursor.classList.toggle(
          "big",
          !!e.target.closest("button,.card,.prow"),
        ),
      );
      document.addEventListener("mousedown", () =>
        cursor.classList.add("down"),
      );
      document.addEventListener("mouseup", () =>
        cursor.classList.remove("down"),
      );
      (function loop() {
        cx += (tx - cx) * 0.16;
        cy += (ty - cy) * 0.16;
        cursor.style.transform = `translate(${cx}px,${cy}px)`;
        requestAnimationFrame(loop);
      })();
      document.querySelectorAll(".mag").forEach((b) => {
        b.addEventListener("mousemove", (e) => {
          const r = b.getBoundingClientRect();
          b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.35}px,${(e.clientY - r.top - r.height / 2) * 0.35}px)`;
        });
        b.addEventListener("mouseleave", () => {
          b.style.transform = "";
        });
      });

      /* ---------- Gold dust particles ---------- */
      const cv = document.getElementById("dust"),
        g = cv.getContext("2d");
      let W, H;
      const P = [];
      function rs() {
        W = cv.width = innerWidth;
        H = cv.height = innerHeight;
      }
      rs();
      addEventListener("resize", rs);
      for (let i = 0; i < 70; i++)
        P.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 1.8 + 0.4,
          vy: -(Math.random() * 0.25 + 0.05),
          vx: (Math.random() - 0.5) * 0.15,
          a: Math.random() * Math.PI * 2,
        });
      (function dust() {
        g.clearRect(0, 0, W, H);
        const mx = parseFloat(stage.style.getPropertyValue("--mx")) || 0;
        P.forEach((p) => {
          p.x += p.vx + mx * 0.15;
          p.y += p.vy;
          p.a += 0.02;
          if (p.y < -5) {
            p.y = H + 5;
            p.x = Math.random() * W;
          }
          if (p.x < -5) p.x = W + 5;
          if (p.x > W + 5) p.x = -5;
          g.globalAlpha = 0.25 + Math.sin(p.a) * 0.2;
          g.fillStyle = "#d9b26f";
          g.beginPath();
          g.arc(p.x, p.y, p.r, 0, 6.283);
          g.fill();
        });
        requestAnimationFrame(dust);
      })();

      /* ---------- Ambient sound ---------- */
      let ac,
        master,
        soundOn = false;
      const soundBtn = document.getElementById("sound");
      soundBtn.onclick = () => {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain();
          master.gain.value = 0;
          const lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 650;
          master.connect(lp);
          lp.connect(ac.destination);
          [110, 164.81, 220, 277.18, 329.63, 440].forEach((f, i) => {
            const o = ac.createOscillator();
            o.type = i % 2 ? "sine" : "triangle";
            o.frequency.value = f;
            o.detune.value = (i - 2) * 7;
            const gn = ac.createGain();
            gn.gain.value = 0.1 / (i + 1) + 0.015;
            const l = ac.createOscillator();
            l.frequency.value = 0.05 + i * 0.027;
            const lg = ac.createGain();
            lg.gain.value = 0.025;
            l.connect(lg);
            lg.connect(gn.gain);
            o.connect(gn);
            gn.connect(master);
            o.start();
            l.start();
          });
        }
        soundOn = !soundOn;
        ac.resume();
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.linearRampToValueAtTime(
          soundOn ? 0.55 : 0,
          ac.currentTime + 2,
        );
        soundBtn.classList.toggle("on", soundOn);
      };

      /* =========================================================
   PRELOAD + START
   ========================================================= */
      const srcs = [
        ...new Set(
          [...document.querySelectorAll("#stage img")].map((i) => i.src),
        ),
      ];
      let done = 0;
      const lbar = document.getElementById("lbar"),
        lpct = document.getElementById("lpct");
      const tick = () => {
        done++;
        const p = Math.round((done / srcs.length) * 100);
        lbar.style.transform = `scaleX(${p / 100})`;
        lpct.textContent = p + "%";
      };
      const startIdx = (() => {
        const n = parseInt(location.hash.slice(1), 10);
        return n >= 1 && n <= total ? n - 1 : 0;
      })();
      let started = false;
      function begin() {
        if (started) return;
        started = true;
        document.getElementById("loader").classList.add("hide");
        setTimeout(() => goTo(startIdx), 450);
      }
      Promise.all(
        srcs.map(
          (s) =>
            new Promise((r) => {
              const i = new Image();
              i.onload = i.onerror = () => {
                tick();
                r();
              };
              i.src = s;
            }),
        ),
      ).then(() => setTimeout(begin, 500));
      setTimeout(begin, 8000); // internet sekin bo'lsa ham kutib o'tirmaydi
    </script>
  </body>
