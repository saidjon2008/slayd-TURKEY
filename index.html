<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>튀르키예 여행 경험</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0a0e13;
        --ink: #f3ede1;
        --gold: #d9b26f;
        --soft: rgba(243, 237, 225, 0.75);
        --ease: cubic-bezier(0.77, 0, 0.18, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans KR", sans-serif;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .grain,
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 50;
      }
      .grain {
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
      }
      .vignette {
        background: radial-gradient(ellipse, transparent 35%, #0008);
      }
      #dust {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 8;
      }
      .header {
        position: fixed;
        z-index: 30;
        top: 0;
        left: 0;
        right: 0;
        height: 76px;
        padding: 0 4.5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(#080b0f99, transparent);
      }
      .brand {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .brand span,
      .counter em {
        color: var(--gold);
      }
      .h-right {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 11px;
        letter-spacing: 2px;
      }
      .tbtn {
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 10px;
        letter-spacing: 2px;
      }
      .tbtn.on {
        color: var(--gold);
      }
      .timeline {
        position: fixed;
        z-index: 30;
        left: 2%;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tl {
        display: flex;
        align-items: center;
        gap: 11px;
        border: 0;
        background: transparent;
        color: var(--soft);
        padding: 7px 0;
        font-size: 9px;
        letter-spacing: 2px;
        text-align: left;
      }
      .tl i {
        width: 14px;
        height: 1px;
        background: currentColor;
        transition: width 0.35s;
      }
      .tl span {
        opacity: 0;
        transform: translateX(-5px);
        transition: 0.3s;
        white-space: nowrap;
      }
      .tl:hover span,
      .tl.active span {
        opacity: 1;
        transform: none;
      }
      .tl.active {
        color: var(--gold);
      }
      .tl.active i {
        width: 32px;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      .slide {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
        clip-path: var(--from, inset(100% 0 0 0));
        transition: clip-path 1.1s var(--ease);
        background: var(--bg);
      }
      .slide.active,
      .slide.under {
        visibility: visible;
      }
      .slide.active {
        clip-path: inset(0);
        z-index: 3;
      }
      .slide.under {
        clip-path: inset(0);
        z-index: 2;
      }
      .bg {
        position: absolute;
        inset: -2%;
        transform: translate3d(
          calc(var(--mx, 0) * -10px),
          calc(var(--my, 0) * -7px),
          0
        );
        transition: transform 0.6s;
      }
      .bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.13);
        transition: transform 9s ease;
      }
      .slide.active .bg img {
        transform: scale(1.02);
      }
      .bg:after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #080b0fdf, #080b0f88 48%, #080b0f20),
          linear-gradient(0deg, #080b0f9c, transparent 50%);
      }
      .glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 78% 40%,
          var(--tint),
          transparent 55%
        );
        opacity: 0.17;
        mix-blend-mode: screen;
      }
      .wrap {
        position: absolute;
        z-index: 4;
        inset: 0;
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        align-items: center;
        gap: 5%;
        padding: 90px 7% 85px 9%;
      }
      .hero .wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 190px 9% 70px;
      }
      .id-top {
        position: absolute;
        z-index: 5;
        top: 95px;
        right: 8%;
        text-align: right;
        max-width: 80%;
      }
      .major {
        font:
          600 clamp(17px, 2vw, 28px) "Noto Serif KR",
          serif;
        color: var(--gold);
        text-shadow: 0 2px 18px #000;
      }
      .nm {
        margin-top: 9px;
        font:
          400 clamp(16px, 1.6vw, 23px) "Noto Serif KR",
          serif;
        text-shadow: 0 2px 18px #000;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 20px;
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 4px;
      }
      .eyebrow:before {
        content: "";
        width: 34px;
        height: 1px;
        background: currentColor;
      }
      .title {
        font:
          600 clamp(34px, 4.6vw, 70px)/1.3 "Noto Serif KR",
          serif;
        letter-spacing: -1px;
        word-break: keep-all;
        background: linear-gradient(100deg, #fff 40%, #f3d9a0);
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
      }
      .hero .title {
        font-size: clamp(43px, 6.5vw, 92px);
        max-width: 900px;
      }
      .ln {
        display: block;
        overflow: hidden;
        padding: 0.05em 0.08em 0.12em 0;
      }
      .ch {
        display: inline-block;
        opacity: 0;
        transform: translateY(110%) rotate(4deg);
        transition:
          transform 0.85s cubic-bezier(0.16, 0.8, 0.2, 1),
          opacity 0.7s;
        transition-delay: calc(var(--i) * 18ms + 200ms);
      }
      .slide.active .ch {
        opacity: 1;
        transform: none;
      }
      .pts {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 11px;
        margin-top: 25px;
        max-width: 700px;
      }
      .pts li {
        padding: 13px 17px;
        border: 1px solid #d9b26f55;
        border-radius: 12px;
        background: #0a0e1375;
        backdrop-filter: blur(8px);
        font:
          500 clamp(14px, 1.35vw, 20px)/1.65 "Noto Serif KR",
          serif;
        word-break: keep-all;
        opacity: 0;
        transform: translateY(16px);
        transition:
          opacity 0.65s,
          transform 0.65s,
          border-color 0.3s;
      }
      .slide.active .pts li {
        opacity: 1;
        transform: none;
      }
      .pts li:nth-child(1) {
        transition-delay: 0.4s;
      }
      .pts li:nth-child(2) {
        transition-delay: 0.6s;
      }
      .pts li:nth-child(3) {
        transition-delay: 0.8s;
      }
      .pts li:before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin: 0 12px 2px 0;
        border-radius: 50%;
        background: var(--gold);
      }
      .arch-wrap {
        position: relative;
        width: 100%;
        max-width: 790px;
        justify-self: center;
        opacity: 0;
        transform: translateY(25px);
        transition:
          opacity 1s 0.3s,
          transform 1s cubic-bezier(0.16, 0.8, 0.2, 1) 0.3s;
      }
      .slide.active .arch-wrap {
        opacity: 1;
        transform: none;
      }
      .arch-wrap:before {
        content: "";
        position: absolute;
        inset: -15px;
        border: 1px solid #d9b26f66;
        border-radius: 220px 220px 22px 22px;
      }
      .arch {
        height: min(76vh, 750px);
        overflow: hidden;
        border-radius: 210px 210px 20px 20px;
        box-shadow: 0 35px 100px #0009;
        background: #182028;
      }
      .arch img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        transform: scale(1.12);
        transition: transform 9s ease;
      }
      .slide.active .arch img {
        transform: scale(1);
      }
      .flip .wrap {
        grid-template-columns: 1.1fr 0.9fr;
      }
      .flip .arch-wrap {
        order: -1;
      }
      .closing .wrap {
        grid-template-columns: 0.8fr 1.2fr;
      }
      .mapbox {
        padding: 18px;
        border: 1px solid #d9b26f55;
        background: #0a101699;
        backdrop-filter: blur(8px);
      }
      .mapbox svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .outline {
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        transition: stroke-dashoffset 3s;
      }
      .slide.active .outline {
        stroke-dashoffset: 0;
      }
      .route {
        fill: none;
        stroke: #c8694a;
        stroke-width: 2;
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        transition: stroke-dashoffset 3s 1s;
      }
      .slide.active .route {
        stroke-dashoffset: 0;
      }
      .pin {
        opacity: 0;
        transition: opacity 0.7s 0.8s;
      }
      .slide.active .pin {
        opacity: 1;
      }
      .pin .c {
        fill: var(--bg);
        stroke: var(--gold);
        stroke-width: 2;
      }
      .pin .p {
        fill: none;
        stroke: var(--gold);
        animation: pulse 2s infinite;
      }
      .pin text {
        fill: var(--ink);
        font-size: 10px;
        letter-spacing: 1px;
        font-weight: 700;
      }
      .pin text.k {
        fill: var(--gold);
        font-size: 11px;
        font-weight: 400;
      }
      @keyframes pulse {
        from {
          r: 5;
          opacity: 0.8;
        }
        to {
          r: 19;
          opacity: 0;
        }
      }
      .restart {
        margin-top: 23px;
        padding: 12px 22px;
        border: 1px solid var(--gold);
        border-radius: 30px;
        background: transparent;
        color: var(--gold);
        font-size: 12px;
        letter-spacing: 2px;
        transition: 0.3s;
      }
      .restart:hover {
        background: var(--gold);
        color: #111;
      }
      .footer {
        position: fixed;
        z-index: 30;
        bottom: 0;
        left: 0;
        right: 0;
        height: 72px;
        padding: 0 4.5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(0deg, #080b0f88, transparent);
      }
      .hint {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--soft);
        font-size: 10px;
        letter-spacing: 2px;
      }
      .hint:before {
        content: "";
        width: 35px;
        height: 1px;
        background: var(--gold);
      }
      .ctrl {
        display: flex;
        gap: 9px;
      }
      .cbtn {
        width: 42px;
        height: 42px;
        border: 1px solid #f3ede177;
        border-radius: 50%;
        background: transparent;
        transition: 0.3s;
      }
      .cbtn:hover {
        color: #111;
        background: var(--gold);
        border-color: var(--gold);
      }
      .pbar {
        position: fixed;
        z-index: 35;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: var(--gold);
        transition: width 0.8s;
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background: var(--bg);
        transition:
          clip-path 1s var(--ease),
          visibility 1s;
        clip-path: inset(0);
      }
      .loader.hide {
        clip-path: inset(0 0 100% 0);
        visibility: hidden;
      }
      .loader b {
        font:
          italic 400 clamp(55px, 10vw, 120px) "Cormorant Garamond",
          serif;
        color: var(--gold);
      }
      .loader small {
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--soft);
      }
      .lb {
        width: 190px;
        height: 2px;
        overflow: hidden;
        background: #303039;
      }
      .lb i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: left;
      }
      @media (max-width: 900px) {
        .header {
          height: 62px;
        }
        .h-right {
          gap: 12px;
        }
        .tag,
        .timeline,
        .hint {
          display: none;
        }
        .footer {
          height: 60px;
        }
        .cbtn {
          width: 36px;
          height: 36px;
        }
        .wrap,
        .closing .wrap,
        .flip .wrap {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          justify-content: center;
          gap: 20px;
          padding: 140px 7% 72px;
          overflow-y: auto;
        }
        .hero .wrap {
          padding: 205px 7% 65px;
        }
        .id-top {
          top: 75px;
          right: 7%;
          max-width: 86%;
        }
        .major {
          font-size: 16px;
        }
        .nm {
          font-size: 15px;
        }
        .title {
          font-size: clamp(30px, 7vw, 46px);
        }
        .hero .title {
          font-size: clamp(38px, 9vw, 63px);
        }
        .pts {
          margin-top: 15px;
          gap: 7px;
        }
        .pts li {
          padding: 9px 12px;
          font-size: 13px;
        }
        .arch-wrap {
          width: 72%;
        }
        .arch {
          height: 27vh;
          border-radius: 100px 100px 15px 15px;
        }
        .arch-wrap:before {
          border-radius: 110px 110px 18px 18px;
        }
        .mapbox {
          padding: 9px;
        }
      }
      @media (max-height: 650px) and (min-width: 901px) {
        .wrap {
          padding-top: 70px;
          padding-bottom: 60px;
        }
        .arch {
          height: 65vh;
        }
        .pts {
          gap: 7px;
          margin-top: 14px;
        }
        .pts li {
          padding: 8px 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="grain"></div>
    <div class="vignette"></div>
    <canvas id="dust"></canvas>

    <div class="loader" id="loader">
      <b>Türkiye</b>
      <div class="lb"><i id="lbar"></i></div>
      <small id="lpct">0%</small>
    </div>

    <header class="header">
      <div class="brand">FIELDNOTES <span>/ TÜRKİYE</span></div>
      <div class="h-right">
        <button class="tbtn" id="auto">
          <span class="tag">AUTO</span><span id="autoIc">▶</span>
        </button>
        <button class="tbtn" id="sound">
          <span class="tag">SOUND</span><span>♫</span>
        </button>
        <div class="counter" id="counter"><em>01</em> / 06</div>
      </div>
    </header>

    <nav class="timeline" id="timeline"></nav>
    <main id="stage"></main>

    <footer class="footer">
      <div class="hint">SCROLL · ← → · SWIPE</div>
      <div class="ctrl">
        <button class="cbtn" id="prev" aria-label="이전">←</button>
        <button class="cbtn" id="next" aria-label="다음">→</button>
        <button class="cbtn" id="full" aria-label="전체 화면">⛶</button>
      </div>
    </footer>
    <div class="pbar" id="pbar"></div>

    <script>
      const imageURLs = {
        // 1-slayd: Istanbul
        hero: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&w=2200&q=85",

        // 2-slayd: Istanbulning tarixiy joylari
        ist: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=2200&q=85",

        // 3-slayd: Turkiyaning boshqa manzarasi — Istanbuldan boshqa rasm
        ant: "https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=2200&q=85",

        // 4-slayd: haqiqiy Kapadokiya havo sharlari surati
        cap: "https://images.unsplash.com/photo-1752228898255-edf840342a9d?auto=format&fit=crop&w=2200&q=85",

        // 5-slayd: turk taomlari — baklava va kebab
        tea: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=2200&q=85",
      };

      const data = [
        {
          type: "hero",
          name: "INTRO",
          tint: "#b9683f",
          image: imageURLs.hero,
          alt: "이스탄불의 풍경",
          eyebrow: "MY TRAVEL STORY",
          title: ["튀르키예 여행 경험"],
          points: [
            "특별했던 튀르키예 여행",
            "아름다운 풍경과 역사",
            "잊지 못할 추억",
          ],
        },
        {
          type: "place",
          name: "REASON",
          tint: "#b9683f",
          image: imageURLs.ist,
          alt: "이스탄불의 역사적인 건축물",
          eyebrow: "01 / WHY TURKIYE",
          title: ["여행을 가게 된 이유"],
          points: [
            "튀르키예의 역사와 문화에 대한 관심",
            "터키 드라마에 대한 관심",
            "새로운 문화 경험",
          ],
        },
        {
          type: "place",
          name: "PLACES",
          tint: "#2d8fb8",
          image: imageURLs.ant,
          alt: "튀르키예의 아름다운 해안 풍경",
          eyebrow: "02 / PLACES TO VISIT",
          title: ["여행지와 주요 활동"],
          points: [
            "이스탄불: 블루 모스크, 아야소피아",
            "카파도키아: 열기구 체험",
            "아름다운 풍경 구경",
          ],
        },
        {
          type: "place",
          name: "MOMENT",
          tint: "#d98a4e",
          image: imageURLs.cap,
          alt: "카파도키아의 열기구",
          eyebrow: "03 / SPECIAL MOMENT",
          title: ["가장 인상 깊었던 순간"],
          points: [
            "열기구를 탔던 순간",
            "하늘에서 본 아름다운 풍경",
            "행복하고 특별했던 경험",
          ],
        },
        {
          type: "place",
          name: "FOOD",
          tint: "#9c654b",
          image: imageURLs.tea,
          alt: "터키 차",
          eyebrow: "04 / TASTE OF TURKIYE",
          title: ["튀르키예 음식"],
          points: ["케밥과 바클라바", "터키 차", "새로운 음식 경험"],
        },
        {
          type: "closing",
          name: "LESSON",
          tint: "#2d8fb8",
          image: imageURLs.ant,
          alt: "튀르키예의 아름다운 해안",
          eyebrow: "05 / WHAT I LEARNED",
          title: ["여행을 통해 배운 점"],
          points: [
            "다른 문화에 대한 이해",
            "소중한 추억",
            "다시 방문하고 싶은 나라",
          ],
        },
      ];

      function escapeHTML(value) {
        return String(value).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      }

      function makeTitle(lines) {
        let i = 0;
        return lines
          .map(
            (line) =>
              `<span class="ln"><span>${[...line]
                .map(
                  (char) =>
                    `<span class="ch" style="--i:${i++}">${escapeHTML(char)}</span>`,
                )
                .join("")}</span></span>`,
          )
          .join("");
      }

      /* Faqat sarlavhalar: qo‘shimcha ichki gaplar yo‘q */
      function makePoints(points) {
        return `<ul class="pts">${points
          .map((point) => `<li>${escapeHTML(point)}</li>`)
          .join("")}</ul>`;
      }

      function makeMap() {
        return `
  <svg viewBox="0 0 600 350" role="img" aria-label="튀르키예 여행지">
    <defs><linearGradient id="mapGold"><stop stop-color="#f3d9a0"/><stop offset="1" stop-color="#c8694a"/></linearGradient></defs>
    <path class="outline" d="M65 100 L130 72 L185 91 L230 64 L290 83 L340 68 L400 91 L455 80 L510 113 L535 150 L500 180 L520 220 L475 250 L425 243 L385 280 L330 260 L285 285 L245 250 L190 260 L150 230 L110 215 L80 175 Z" fill="#d9b26f10" stroke="url(#mapGold)" stroke-width="2"/>
    <path class="route" d="M150 125 Q220 155 290 185 T420 245"/>
    <g class="pin" transform="translate(150 125)"><circle class="p" r="6"/><circle class="c" r="5"/><text x="13" y="-8">ISTANBUL</text><text class="k" x="13" y="10">이스탄불</text></g>
    <g class="pin" transform="translate(290 185)"><circle class="p" r="6"/><circle class="c" r="5"/><text x="13" y="-8">CAPPADOCIA</text><text class="k" x="13" y="10">카파도키아</text></g>
    <g class="pin" transform="translate(420 245)"><circle class="p" r="6"/><circle class="c" r="5"/><text x="-13" y="-8" text-anchor="end">ANTALYA</text><text class="k" x="-13" y="10" text-anchor="end">안탈리아</text></g>
  </svg>`;
      }

      function makeSlide(item) {
        const hero = item.type === "hero";
        const closing = item.type === "closing";
        const classes = [
          "slide",
          hero ? "hero" : "",
          closing ? "closing" : "",
          !hero && !closing ? "place" : "",
        ]
          .filter(Boolean)
          .join(" ");
        const heading = `<div class="eyebrow">${escapeHTML(item.eyebrow)}</div><h1 class="title">${makeTitle(item.title)}</h1>${makePoints(item.points)}`;
        const identity = hero
          ? `<div class="id-top"><div class="major">한국어 통번역 전공 2학년</div><div class="nm">욱타모바 자스미나입니다</div></div>`
          : "";
        let content;

        if (hero) {
          content = `${identity}<div class="wrap">${heading}</div>`;
        } else if (closing) {
          content = `<div class="wrap"><div>${heading}<button class="restart" id="restart">↺ 처음으로</button></div><div class="mapbox">${makeMap()}</div></div>`;
        } else {
          content = `<div class="wrap"><div>${heading}</div><figure class="arch-wrap"><div class="arch"><img src="${item.image}" alt="${escapeHTML(item.alt)}"></div></figure></div>`;
        }

        return `<section class="${classes}" style="--tint:${item.tint}">
    <div class="bg"><img src="${item.image}" alt="${escapeHTML(item.alt)}"></div>
    <div class="glow"></div>${content}
  </section>`;
      }

      const stage = document.getElementById("stage");
      stage.innerHTML = data.map(makeSlide).join("");
      const slides = [...stage.querySelectorAll(".slide")];
      const total = slides.length;
      slides.forEach((slide) => (slide.inert = true));

      const timeline = document.getElementById("timeline");
      timeline.innerHTML = data
        .map(
          (item, i) =>
            `<button class="tl" data-i="${i}"><i></i><span>${String(i + 1).padStart(2, "0")} · ${item.name}</span></button>`,
        )
        .join("");
      const timelineButtons = [...timeline.children];

      let current = -1,
        busy = false,
        autoOn = false,
        autoTimer;

      function goTo(index) {
        if (busy || index === current || index < 0 || index >= total) return;
        busy = true;
        const old = slides[current],
          nextSlide = slides[index];
        const direction = current === -1 || index > current ? 1 : -1;
        nextSlide.style.setProperty(
          "--from",
          direction > 0 ? "inset(100% 0 0 0)" : "inset(0 0 100% 0)",
        );
        nextSlide.classList.add("enter");
        void nextSlide.offsetWidth;

        if (old) {
          old.classList.remove("active");
          old.classList.add("under");
          old.inert = true;
        }
        nextSlide.classList.add("active");
        nextSlide.inert = false;
        current = index;

        document.getElementById("counter").innerHTML =
          `<em>${String(index + 1).padStart(2, "0")}</em> / ${String(total).padStart(2, "0")}`;
        document.getElementById("pbar").style.width =
          ((index + 1) / total) * 100 + "%";
        timelineButtons.forEach((b, i) =>
          b.classList.toggle("active", i === index),
        );

        try {
          history.replaceState(null, "", "#" + (index + 1));
        } catch (e) {}
        clearTimeout(autoTimer);
        if (autoOn) autoTimer = setTimeout(next, 9500);

        setTimeout(() => {
          if (old) old.classList.remove("under", "enter");
          nextSlide.classList.remove("enter");
          busy = false;
        }, 1200);
      }

      function next() {
        goTo((current + 1) % total);
      }
      function prev() {
        goTo((current - 1 + total) % total);
      }

      document.getElementById("next").addEventListener("click", next);
      document.getElementById("prev").addEventListener("click", prev);
      timelineButtons.forEach((b) =>
        b.addEventListener("click", () => goTo(Number(b.dataset.i))),
      );

      document.addEventListener("click", (event) => {
        if (event.target.closest("#restart")) goTo(0);
      });

      document.addEventListener("keydown", (event) => {
        if (
          event.target.closest("button") &&
          ["Enter", " "].includes(event.key)
        )
          return;
        if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(event.key)) {
          event.preventDefault();
          next();
        } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(event.key)) {
          event.preventDefault();
          prev();
        } else if (/^[1-6]$/.test(event.key)) goTo(Number(event.key) - 1);
        else if (event.key === "Home") goTo(0);
        else if (event.key === "End") goTo(total - 1);
        else if (event.key.toLowerCase() === "f")
          document.getElementById("full").click();
        else if (event.key.toLowerCase() === "a")
          document.getElementById("auto").click();
        else if (event.key.toLowerCase() === "m")
          document.getElementById("sound").click();
      });

      document.getElementById("full").addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (e) {}
      });

      const autoButton = document.getElementById("auto");
      autoButton.addEventListener("click", () => {
        autoOn = !autoOn;
        autoButton.classList.toggle("on", autoOn);
        document.getElementById("autoIc").textContent = autoOn ? "Ⅱ" : "▶";
        clearTimeout(autoTimer);
        if (autoOn) autoTimer = setTimeout(next, 9500);
      });

      let wheelLock = false;
      document.addEventListener(
        "wheel",
        (event) => {
          if (wheelLock || Math.abs(event.deltaY) < 25) return;
          wheelLock = true;
          event.deltaY > 0 ? next() : prev();
          setTimeout(() => (wheelLock = false), 1200);
        },
        { passive: true },
      );

      let touchX = 0,
        touchY = 0;
      document.addEventListener(
        "touchstart",
        (event) => {
          touchX = event.changedTouches[0].clientX;
          touchY = event.changedTouches[0].clientY;
        },
        { passive: true },
      );

      document.addEventListener(
        "touchend",
        (event) => {
          const dx = event.changedTouches[0].clientX - touchX;
          const dy = event.changedTouches[0].clientY - touchY;
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy))
            dx < 0 ? next() : prev();
        },
        { passive: true },
      );

      window.addEventListener("hashchange", () => {
        const n = parseInt(location.hash.slice(1), 10);
        if (n >= 1 && n <= total) goTo(n - 1);
      });

      document.addEventListener("mousemove", (event) => {
        stage.style.setProperty(
          "--mx",
          ((event.clientX / innerWidth - 0.5) * 2).toFixed(3),
        );
        stage.style.setProperty(
          "--my",
          ((event.clientY / innerHeight - 0.5) * 2).toFixed(3),
        );
      });

      const canvas = document.getElementById("dust");
      const ctx = canvas.getContext("2d");
      let W, H;
      function resizeCanvas() {
        W = canvas.width = innerWidth;
        H = canvas.height = innerHeight;
      }
      resizeCanvas();
      addEventListener("resize", resizeCanvas);

      const particles = Array.from({ length: 65 }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.5 + 0.4,
        vx: (Math.random() - 0.5) * 0.15,
        vy: -(Math.random() * 0.25 + 0.05),
        a: Math.random() * 6.28,
      }));

      function drawParticles() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.a += 0.02;
          if (p.y < -5) {
            p.y = H + 5;
            p.x = Math.random() * W;
          }
          if (p.x < -5) p.x = W + 5;
          if (p.x > W + 5) p.x = -5;
          ctx.globalAlpha = 0.25 + Math.sin(p.a) * 0.2;
          ctx.fillStyle = "#d9b26f";
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(drawParticles);
      }
      drawParticles();

      let audioContext,
        masterGain,
        soundOn = false;
      document.getElementById("sound").addEventListener("click", () => {
        if (!audioContext) {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioClass) return;
          audioContext = new AudioClass();
          masterGain = audioContext.createGain();
          masterGain.gain.value = 0;
          const filter = audioContext.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 650;
          masterGain.connect(filter);
          filter.connect(audioContext.destination);
          [110, 164.81, 220, 277.18, 329.63, 440].forEach((frequency, i) => {
            const oscillator = audioContext.createOscillator();
            oscillator.type = i % 2 ? "sine" : "triangle";
            oscillator.frequency.value = frequency;
            const gain = audioContext.createGain();
            gain.gain.value = 0.1 / (i + 1) + 0.015;
            oscillator.connect(gain);
            gain.connect(masterGain);
            oscillator.start();
          });
        }
        soundOn = !soundOn;
        audioContext.resume();
        masterGain.gain.cancelScheduledValues(audioContext.currentTime);
        masterGain.gain.linearRampToValueAtTime(
          soundOn ? 0.12 : 0,
          audioContext.currentTime + 1,
        );
        document.getElementById("sound").classList.toggle("on", soundOn);
      });

      const loader = document.getElementById("loader");
      const loadBar = document.getElementById("lbar");
      const loadPercent = document.getElementById("lpct");
      const uniqueURLs = [
        ...new Set(
          [...document.querySelectorAll("#stage img")].map((img) => img.src),
        ),
      ];
      let loaded = 0,
        started = false;

      function updateLoader() {
        loaded++;
        const percent = Math.round((loaded / uniqueURLs.length) * 100);
        loadBar.style.transform = `scaleX(${percent / 100})`;
        loadPercent.textContent = percent + "%";
      }

      function begin() {
        if (started) return;
        started = true;
        loadBar.style.transform = "scaleX(1)";
        loadPercent.textContent = "100%";
        loader.classList.add("hide");
        const n = parseInt(location.hash.slice(1), 10);
        const startIndex = n >= 1 && n <= total ? n - 1 : 0;
        setTimeout(() => goTo(startIndex), 400);
      }

      Promise.all(
        uniqueURLs.map(
          (url) =>
            new Promise((resolve) => {
              const img = new Image();
              img.onload = img.onerror = () => {
                updateLoader();
                resolve();
              };
              img.src = url;
            }),
        ),
      ).then(() => setTimeout(begin, 300));

      setTimeout(begin, 7000);
    </script>
  </body>
</html>
