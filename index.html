<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>튀르키예 여행 | Türkiye Travel</title>
    <meta
      name="description"
      content="두 대륙이 만나는 곳, 튀르키예의 대표 여행지를 소개하는 인터랙티브 프레젠테이션"
    />
    <meta name="theme-color" content="#171916" />
    <meta property="og:title" content="튀르키예 여행 | Türkiye Travel" />
    <meta
      property="og:description"
      content="이스탄불, 카파도키아, 파묵칼레, 안탈리아를 만나 보세요."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --cream: #f5f2ec;
        --ink: #242923;
        --muted: #777970;
        --accent: #c66b48;
        --accent-soft: #e5b49b;
        --dark: #171916;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background: var(--dark);
        color: var(--ink);
        font-family: "DM Sans", "Noto Sans KR", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
      }

      .presentation {
        position: relative;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: var(--cream);
      }

      /* ---------- LOADER ---------- */
      .loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--dark);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        transition:
          opacity 0.9s ease,
          visibility 0.9s;
      }
      .loader.hide {
        opacity: 0;
        visibility: hidden;
      }
      .loader-title {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: clamp(34px, 6vw, 60px);
        letter-spacing: -1px;
      }
      .loader-bar {
        width: 160px;
        height: 2px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      .loader-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: var(--accent);
        animation: load 1.2s ease-in-out infinite;
      }
      @keyframes load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }

      /* ---------- SLIDES ---------- */
      .slide {
        position: absolute;
        inset: 0;
        display: flex;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(40px);
        transition:
          opacity 0.8s ease,
          transform 0.9s var(--ease),
          visibility 0.8s;
      }
      .slide.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(0);
        z-index: 2;
      }
      .slide.leaving {
        transform: translateX(-35px);
      }

      .slide-image {
        position: absolute;
        inset: -2%;
        overflow: hidden;
        background: linear-gradient(135deg, #5b6b66, #c4b9a7);
        transform: translate3d(
          calc(var(--mx, 0) * -14px),
          calc(var(--my, 0) * -10px),
          0
        );
        transition: transform 0.5s ease-out;
      }
      .slide-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.12);
        transition: transform 9s cubic-bezier(0.2, 0.6, 0.3, 1);
      }
      .slide.active .slide-image img {
        transform: scale(1);
      }
      .slide-image::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(16, 21, 20, 0.78) 0%,
          rgba(16, 21, 20, 0.4) 46%,
          rgba(16, 21, 20, 0.08) 100%
        );
      }

      /* ---------- HEADER ---------- */
      .header {
        position: absolute;
        z-index: 10;
        top: 0;
        left: 0;
        right: 0;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5.5%;
        color: var(--ink);
        border-bottom: 1px solid rgba(0, 0, 0, 0.12);
        transition:
          color 0.6s ease,
          border-color 0.6s ease;
      }
      .header.on-dark {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.22);
      }
      .brand {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2.5px;
      }
      .brand span {
        color: var(--accent);
      }
      .header.on-dark .brand span {
        color: var(--accent-soft);
      }
      .header-right {
        display: flex;
        gap: 26px;
        align-items: center;
        font-size: 10px;
        letter-spacing: 1.6px;
      }
      .header-label {
        opacity: 0.75;
      }
      .slide-number {
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- TYPOGRAPHY ---------- */
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 13px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 23px;
      }
      .eyebrow::before {
        content: "";
        width: 34px;
        height: 1px;
        background: currentColor;
      }

      .title {
        max-width: 900px;
        font-size: clamp(42px, 7.2vw, 96px);
        line-height: 1.13;
        font-weight: 500;
        letter-spacing: -2px;
        word-break: keep-all;
      }
      .title .serif {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-style: italic;
        letter-spacing: -2px;
        color: var(--accent);
      }
      .description {
        max-width: 560px;
        margin-top: 26px;
        font-family: "Noto Sans KR", sans-serif;
        font-size: clamp(13px, 1.35vw, 16px);
        font-weight: 300;
        line-height: 2.05;
        word-break: keep-all;
      }

      /* dark slides */
      .on-photo .eyebrow {
        color: var(--accent-soft);
      }
      .on-photo .title,
      .on-photo .description {
        color: #fff;
      }
      .on-photo .title .serif {
        color: var(--accent-soft);
      }
      .on-photo .description {
        color: #f1eee6;
      }

      /* ---------- LAYOUT: FULL PHOTO ---------- */
      .content {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 105px 10% 110px;
      }
      .hero-bottom {
        position: absolute;
        bottom: 112px;
        left: 10%;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 10px;
        letter-spacing: 2px;
        color: #fff;
      }
      .hero-bottom .line {
        width: 55px;
        height: 1px;
        background: rgba(255, 255, 255, 0.8);
      }
      .scroll-note {
        position: absolute;
        right: 5.5%;
        bottom: 112px;
        color: #fff;
        font-size: 9px;
        letter-spacing: 2px;
        writing-mode: vertical-rl;
        opacity: 0.85;
      }

      /* ---------- LAYOUT: TEXT + PHOTO PANEL ---------- */
      .inner {
        position: relative;
        z-index: 3;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 0.78fr;
        align-items: center;
        gap: 7%;
        padding: 110px 10% 100px;
      }
      .inner .title {
        font-size: clamp(40px, 5.3vw, 70px);
      }
      .inner .description {
        color: #66675e;
        margin-top: 22px;
        max-width: 490px;
      }
      .light-slide {
        background: var(--cream);
      }

      .big-number {
        position: absolute;
        z-index: 1;
        right: 4%;
        bottom: 2%;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: clamp(160px, 28vw, 420px);
        line-height: 1;
        color: rgba(198, 107, 72, 0.08);
        pointer-events: none;
        user-select: none;
      }

      .photo-panel {
        position: relative;
        width: 100%;
        height: min(62vh, 520px);
        overflow: hidden;
        background: linear-gradient(135deg, #cdbfae, #e8dfd1);
        box-shadow: 0 30px 60px -25px rgba(36, 41, 35, 0.45);
      }
      .photo-panel img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.1);
        transition: transform 9s ease;
      }
      .active .photo-panel img {
        transform: scale(1);
      }
      .photo-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 35px 20px 18px;
        color: #fff;
        font-size: 10px;
        letter-spacing: 1.8px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
      }

      /* ---------- LAYOUT: SIDE PHOTO ---------- */
      .split-photo {
        position: absolute;
        inset: 0 0 0 48%;
        overflow: hidden;
        background: linear-gradient(135deg, #8fb3b8, #d9e6e6);
      }
      .split-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.1);
        transition: transform 9s ease;
      }
      .active .split-photo img {
        transform: scale(1);
      }
      .split-photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, var(--cream), transparent 30%);
      }
      .split-content {
        position: relative;
        z-index: 2;
        width: 60%;
        padding: 115px 0 110px 10%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .split-content .title {
        font-size: clamp(40px, 5.3vw, 70px);
      }
      .split-content .description {
        color: #66675e;
        margin-top: 22px;
      }

      /* ---------- PLACE META / INFO ---------- */
      .place-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 30px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1.5px;
      }
      .place-meta span:first-child {
        color: var(--accent);
        font-weight: 700;
      }
      .on-photo .place-meta {
        color: rgba(255, 255, 255, 0.8);
      }
      .on-photo .place-meta span:first-child {
        color: var(--accent-soft);
      }

      .info {
        display: grid;
        grid-template-columns: repeat(3, auto);
        justify-content: start;
        gap: 34px;
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid #d9d4ca;
        max-width: 520px;
      }
      .on-photo .info {
        border-color: rgba(255, 255, 255, 0.35);
      }
      .info small {
        display: block;
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .on-photo .info small {
        color: var(--accent-soft);
      }
      .info b {
        display: block;
        font-family: "Noto Sans KR", sans-serif;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.6;
        word-break: keep-all;
      }
      .on-photo .info b {
        color: #fff;
      }

      /* ---------- CLOSING ---------- */
      .closing-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 26px 34px;
        margin-top: 34px;
        max-width: 700px;
      }
      .closing-item {
        border-top: 1px solid rgba(255, 255, 255, 0.3);
        padding-top: 14px;
      }
      .closing-item strong {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        color: #fff;
      }
      .closing-item span {
        color: #c4c8bf;
        font-family: "Noto Sans KR", sans-serif;
        font-size: 11.5px;
        line-height: 1.9;
        word-break: keep-all;
      }
      .restart {
        margin-top: 36px;
        align-self: flex-start;
        padding: 13px 26px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 40px;
        background: transparent;
        color: #fff;
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .restart:hover {
        background: #fff;
        color: var(--ink);
      }

      /* ---------- DOTS ---------- */
      .dots {
        position: absolute;
        z-index: 15;
        right: 2.2%;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 14px;
        color: var(--ink);
        transition: color 0.6s;
      }
      .dots.on-dark {
        color: #fff;
      }
      .dot-btn {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 1px solid currentColor;
        background: transparent;
        cursor: pointer;
        padding: 0;
        opacity: 0.55;
        transition: all 0.4s var(--ease);
      }
      .dot-btn:hover {
        opacity: 1;
      }
      .dot-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        opacity: 1;
        height: 26px;
        border-radius: 6px;
      }

      /* ---------- FOOTER ---------- */
      .footer {
        position: absolute;
        z-index: 20;
        bottom: 0;
        left: 0;
        right: 0;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5.5%;
        color: var(--ink);
        transition: color 0.6s;
      }
      .footer.on-dark {
        color: #fff;
      }
      .footer-left {
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: 10px;
        letter-spacing: 1.4px;
      }
      .footer-left .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .control-btn {
        width: 40px;
        height: 40px;
        border: 1px solid currentColor;
        border-radius: 50%;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 16px;
        display: grid;
        place-items: center;
        transition:
          background 0.25s,
          color 0.25s,
          transform 0.25s;
      }
      .control-btn:hover {
        background: var(--ink);
        color: #fff;
        transform: scale(1.07);
      }
      .footer.on-dark .control-btn:hover {
        background: #fff;
        color: #222;
      }
      .control-btn:focus-visible,
      .dot-btn:focus-visible,
      .restart:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .control-btn.playing {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .progress-track {
        position: absolute;
        z-index: 25;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: rgba(120, 120, 120, 0.2);
      }
      .progress-bar {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.7s ease;
      }

      /* ---------- REVEAL ---------- */
      .reveal {
        opacity: 0;
        transform: translateY(24px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }
      .active .reveal {
        opacity: 1;
        transform: none;
      }
      .active .reveal.d1 {
        transition-delay: 0.15s;
      }
      .active .reveal.d2 {
        transition-delay: 0.3s;
      }
      .active .reveal.d3 {
        transition-delay: 0.45s;
      }
      .active .reveal.d4 {
        transition-delay: 0.6s;
      }

      /* ---------- MOBILE ---------- */
      @media (max-width: 760px) {
        .header {
          height: 65px;
          padding: 0 6%;
        }
        .header-right {
          gap: 12px;
        }
        .header-label,
        .dots,
        .scroll-note {
          display: none;
        }

        .content {
          padding: 95px 7% 100px;
        }
        .title {
          font-size: clamp(38px, 11vw, 64px);
          letter-spacing: -1.5px;
        }
        .description {
          font-size: 13px;
          line-height: 1.9;
          margin-top: 18px;
        }
        .hero-bottom {
          left: 7%;
          bottom: 95px;
        }

        .inner {
          grid-template-columns: 1fr;
          gap: 22px;
          padding: 88px 7% 88px;
          overflow-y: auto;
          align-content: center;
        }
        .inner .title {
          font-size: clamp(34px, 9.5vw, 52px);
        }
        .inner .description {
          margin-top: 12px;
        }
        .photo-panel {
          height: 28vh;
          min-height: 170px;
          order: -1;
        }
        .place-meta {
          margin-top: 14px;
        }
        .info {
          gap: 18px;
          margin-top: 16px;
          padding-top: 12px;
          grid-template-columns: repeat(3, 1fr);
        }
        .info b {
          font-size: 11.5px;
        }

        .split-photo {
          inset: 0;
        }
        .split-photo::after {
          background: linear-gradient(
            90deg,
            rgba(245, 242, 236, 0.97),
            rgba(245, 242, 236, 0.85) 50%,
            rgba(245, 242, 236, 0.2)
          );
        }
        .split-content {
          width: 92%;
          padding: 95px 0 90px 7%;
        }

        .closing-grid {
          gap: 16px;
          grid-template-columns: 1fr 1fr;
        }
        .footer {
          height: 65px;
          padding: 0 6%;
        }
        .control-btn {
          width: 36px;
          height: 36px;
        }
        .big-number {
          font-size: 150px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="loader" id="loader">
      <div class="loader-title">Türkiye</div>
      <div class="loader-bar"></div>
    </div>

    <main
      class="presentation"
      id="presentation"
      role="region"
      aria-roledescription="carousel"
      aria-label="튀르키예 여행 프레젠테이션"
    >
      <header class="header on-dark" id="header">
        <div class="brand">FIELDNOTES <span>/ TRAVEL</span></div>
        <div class="header-right">
          <span class="header-label">A JOURNEY THROUGH TÜRKİYE</span>
          <span class="slide-number" id="topNumber" aria-live="polite"
            >01 / 06</span
          >
        </div>
      </header>

      <!-- Slides are generated by JavaScript below -->
      <div id="slides"></div>

      <nav class="dots on-dark" id="dots" aria-label="슬라이드 이동"></nav>

      <footer class="footer on-dark" id="footer">
        <div class="footer-left">
          <span class="dot"></span>
          <span id="sectionName">INTRODUCTION</span>
        </div>
        <div class="controls">
          <button class="control-btn" id="prev" aria-label="이전 슬라이드">
            ←
          </button>
          <button class="control-btn" id="play" aria-label="자동 재생">
            ▶
          </button>
          <button class="control-btn" id="next" aria-label="다음 슬라이드">
            →
          </button>
          <button class="control-btn" id="fullscreen" aria-label="전체 화면">
            ⛶
          </button>
        </div>
      </footer>

      <div class="progress-track">
        <div class="progress-bar" id="progress"></div>
      </div>
    </main>

    <script>
      /* =========================================================
   DATA — yangi joy qo'shish uchun shu massivga obyekt qo'shing
   ========================================================= */
      const U = (id, w = 1800) =>
        `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`;

      const slidesData = [
        {
          type: "hero",
          name: "INTRODUCTION",
          theme: "dark",
          img: U("photo-1524231757912-21f4fe3a7200", 2000),
          alt: "이스탄불의 역사적인 도시 풍경",
          eyebrow: "DISCOVER TÜRKİYE · 2026",
          title: "두 대륙이 만나는 곳,<br><span class='serif'>Türkiye</span>",
          text: "역사와 자연, 문화와 바다가 함께하는 나라.<br>튀르키예의 아름다운 여행지를 만나 보겠습니다.",
        },
        {
          type: "panel",
          name: "ISTANBUL",
          theme: "light",
          num: "01",
          img: U("photo-1541432901042-2d8bd64b4a9b", 1200),
          alt: "이스탄불의 모스크와 도시 풍경",
          caption: "ISTANBUL, TÜRKİYE",
          eyebrow: "01 — HISTORY & CULTURE",
          title: "역사가 살아 숨 쉬는<br><span class='serif'>이스탄불</span>",
          text: "이스탄불은 유럽과 아시아를 연결하는 특별한 도시입니다. 아야 소피아와 블루 모스크 같은 역사적인 건축물을 감상하고, 보스포루스 해협의 아름다운 풍경도 즐길 수 있습니다.",
          meta: ["ISTANBUL", "역사와 문화"],
          info: [
            ["BEST SEASON", "4–5월 · 9–11월"],
            ["DURATION", "3–4일"],
            ["MUST-SEE", "아야 소피아 · 블루 모스크 · 보스포루스"],
          ],
        },
        {
          type: "full",
          name: "CAPPADOCIA",
          theme: "dark",
          img: U("photo-1570939274717-7eda259b50ed", 2000),
          alt: "카파도키아의 자연 경관",
          eyebrow: "02 — NATURE & ADVENTURE",
          title: "하늘을 수놓는<br><span class='serif'>카파도키아</span>",
          text: "카파도키아는 독특한 바위 지형과 아름다운 계곡으로 유명합니다. 해가 뜨는 아침, 하늘을 가득 채운 열기구는 이곳에서 만날 수 있는 가장 인상적인 풍경 중 하나입니다.",
          meta: ["GÖREME", "자연과 모험"],
          info: [
            ["BEST SEASON", "4–6월 · 9–10월"],
            ["DURATION", "2–3일"],
            ["MOMENT", "열기구 · 암석 지형 · 동굴 마을"],
          ],
        },
        {
          type: "panel",
          name: "PAMUKKALE",
          theme: "light",
          num: "03",
          img: U("photo-1600255821058-c4f3f3d8f7f2", 1200),
          alt: "파묵칼레의 자연 경관",
          caption: "PAMUKKALE, DENİZLİ",
          eyebrow: "03 — NATURAL WONDER",
          title: "하얀 자연의 예술,<br><span class='serif'>파묵칼레</span>",
          text: "파묵칼레는 온천수로 만들어진 하얀 석회붕으로 유명합니다. 계단처럼 이어지는 자연의 테라스와 푸른 물이 아름다운 풍경을 만들어 냅니다. 인근의 고대 도시 히에라폴리스도 함께 둘러볼 수 있습니다.",
          meta: ["PAMUKKALE", "자연과 역사"],
          info: [
            ["BEST SEASON", "4–5월 · 9–10월"],
            ["DURATION", "반나절–1일"],
            ["HIGHLIGHT", "석회붕 · 온천수 · 히에라폴리스"],
          ],
        },
        {
          type: "side",
          name: "ANTALYA",
          theme: "light",
          img: U("photo-1533105079780-92b9be482077", 2000),
          alt: "지중해 연안의 아름다운 바다",
          eyebrow: "04 — SEA & RELAXATION",
          title: "지중해의 푸른 낙원,<br><span class='serif'>안탈리아</span>",
          text: "안탈리아는 맑고 푸른 바다와 아름다운 해변으로 사랑받는 휴양 도시입니다. 바닷가를 산책하고, 구시가지의 골목을 둘러보며 여유로운 여행을 즐길 수 있습니다.",
          meta: ["ANTALYA", "바다와 휴식"],
          info: [
            ["BEST SEASON", "5–10월"],
            ["DURATION", "3–4일"],
            ["HIGHLIGHT", "지중해 해변 · 칼레이치"],
          ],
        },
        {
          type: "closing",
          name: "CONCLUSION",
          theme: "dark",
          img: U("photo-1544787219-7f47ccb76574", 2000),
          alt: "따뜻한 차와 여유로운 여행의 순간",
          eyebrow: "05 — THE END OF OUR JOURNEY",
          title:
            "여행은 끝나도,<br><span class='serif'>추억은 남습니다.</span>",
          text: "튀르키예는 아름다운 자연뿐만 아니라 오랜 역사와 다양한 문화를 경험할 수 있는 나라입니다. 언젠가 직접 방문하여 이 모든 풍경을 만나 보고 싶습니다. 여러분도 튀르키예에서 특별한 추억을 만들어 보세요.",
          items: [
            ["역사와 문화", "이스탄불에서 만나는 오랜 이야기"],
            ["하늘과 바위", "카파도키아의 열기구와 동굴 마을"],
            ["하얀 온천", "파묵칼레의 석회붕과 고대 도시"],
            ["바다와 휴식", "안탈리아의 푸른 지중해"],
          ],
        },
      ];

      /* =========================================================
   RENDER
   ========================================================= */
      const img = (s, cls = "") =>
        `<img src="${s.img}" alt="${s.alt}" ${cls} loading="eager" decoding="async" onerror="this.remove()">`;

      const metaHTML = (s) =>
        s.meta
          ? `<div class="place-meta reveal d3"><span>${s.meta[0]}</span><span>·</span><span>${s.meta[1]}</span></div>`
          : "";

      const infoHTML = (s) =>
        s.info
          ? `<div class="info reveal d4">${s.info.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("")}</div>`
          : "";

      const textBlock = (s) => `
  <div class="eyebrow reveal">${s.eyebrow}</div>
  <h${s.type === "hero" ? 1 : 2} class="title reveal d1">${s.title}</h${s.type === "hero" ? 1 : 2}>
  <p class="description reveal d2">${s.text}</p>`;

      const templates = {
        hero: (s) => `
    <div class="slide-image">${img(s)}</div>
    <div class="content on-photo">
      ${textBlock(s)}
      <div class="hero-bottom reveal d3"><span class="line"></span><span>TRAVEL · CULTURE · DISCOVERY</span></div>
      <div class="scroll-note">PRESS → OR SWIPE</div>
    </div>`,

        full: (s) => `
    <div class="slide-image">${img(s)}</div>
    <div class="content on-photo">
      ${textBlock(s)}
      ${metaHTML(s)}
      ${infoHTML(s)}
    </div>`,

        panel: (s) => `
    <div class="big-number">${s.num}</div>
    <div class="inner">
      <div>
        ${textBlock(s)}
        ${metaHTML(s)}
        ${infoHTML(s)}
      </div>
      <figure class="photo-panel reveal d2">
        ${img(s)}
        <figcaption class="photo-caption">${s.caption}</figcaption>
      </figure>
    </div>`,

        side: (s) => `
    <div class="split-photo">${img(s)}</div>
    <div class="split-content">
      ${textBlock(s)}
      ${metaHTML(s)}
      ${infoHTML(s)}
    </div>`,

        closing: (s) => `
    <div class="slide-image">${img(s)}</div>
    <div class="content on-photo">
      ${textBlock(s)}
      <div class="closing-grid reveal d3">
        ${s.items.map(([a, b]) => `<div class="closing-item"><strong>${a}</strong><span>${b}</span></div>`).join("")}
      </div>
      <button class="restart reveal d4" id="restart">↺ 처음부터 다시 보기</button>
    </div>`,
      };

      const root = document.getElementById("slides");
      root.innerHTML = slidesData
        .map(
          (s, i) => `
  <section class="slide ${s.type === "panel" || s.type === "side" ? "light-slide" : ""}"
           data-theme="${s.theme}" role="group" aria-roledescription="slide"
           aria-label="${i + 1} / ${slidesData.length}">
    ${templates[s.type](s)}
  </section>`,
        )
        .join("");

      /* =========================================================
   ELEMENTS & STATE
   ========================================================= */
      const slides = [...document.querySelectorAll(".slide")];
      const header = document.getElementById("header");
      const footer = document.getElementById("footer");
      const dotsBox = document.getElementById("dots");
      const progress = document.getElementById("progress");
      const topNumber = document.getElementById("topNumber");
      const sectionName = document.getElementById("sectionName");
      const playBtn = document.getElementById("play");
      const total = slides.length;

      dotsBox.innerHTML = slidesData
        .map(
          (s, i) =>
            `<button class="dot-btn" data-i="${i}" aria-label="${i + 1}번 슬라이드: ${s.name}"></button>`,
        )
        .join("");
      const dotBtns = [...dotsBox.querySelectorAll(".dot-btn")];

      let current = -1;
      let isAnimating = false;
      let autoTimer = null;
      const AUTO_DELAY = 7000;

      /* =========================================================
   NAVIGATION
   ========================================================= */
      function goTo(index, fromUser = true) {
        if (isAnimating || index === current) return;
        if (index < 0 || index >= total) return;

        isAnimating = true;
        const oldSlide = slides[current];
        const newSlide = slides[index];

        if (oldSlide) {
          oldSlide.classList.add("leaving");
          oldSlide.classList.remove("active");
        }
        newSlide.classList.remove("leaving");
        newSlide.classList.add("active");

        current = index;

        slides.forEach((s, i) => {
          s.inert = i !== current;
        });

        const dark = newSlide.dataset.theme === "dark";
        [header, footer, dotsBox].forEach((el) =>
          el.classList.toggle("on-dark", dark),
        );

        topNumber.textContent =
          String(current + 1).padStart(2, "0") +
          " / " +
          String(total).padStart(2, "0");
        sectionName.textContent = slidesData[current].name;
        progress.style.width = ((current + 1) / total) * 100 + "%";
        dotBtns.forEach((d, i) => d.classList.toggle("active", i === current));

        history.replaceState(null, "", "#" + (current + 1));
        preloadNext();
        if (fromUser && autoTimer) startAuto();

        setTimeout(() => {
          if (oldSlide) oldSlide.classList.remove("leaving");
          isAnimating = false;
        }, 900);
      }

      const next = () => goTo((current + 1) % total);
      const prev = () => goTo((current - 1 + total) % total);

      function preloadNext() {
        [1, 2].forEach((n) => {
          const s = slidesData[(current + n) % total];
          if (s && s.img) new Image().src = s.img;
        });
      }

      /* ---------- Autoplay ---------- */
      function startAuto() {
        clearInterval(autoTimer);
        autoTimer = setInterval(
          () => goTo((current + 1) % total, false),
          AUTO_DELAY,
        );
        playBtn.textContent = "❚❚";
        playBtn.classList.add("playing");
        playBtn.setAttribute("aria-label", "일시정지");
      }
      function stopAuto() {
        clearInterval(autoTimer);
        autoTimer = null;
        playBtn.textContent = "▶";
        playBtn.classList.remove("playing");
        playBtn.setAttribute("aria-label", "자동 재생");
      }

      /* =========================================================
   EVENTS
   ========================================================= */
      document.getElementById("next").addEventListener("click", next);
      document.getElementById("prev").addEventListener("click", prev);
      playBtn.addEventListener("click", () =>
        autoTimer ? stopAuto() : startAuto(),
      );
      dotBtns.forEach((d) =>
        d.addEventListener("click", () => goTo(+d.dataset.i)),
      );
      document.addEventListener("click", (e) => {
        if (e.target.id === "restart") goTo(0);
      });

      document
        .getElementById("fullscreen")
        .addEventListener("click", async () => {
          try {
            if (!document.fullscreenElement)
              await document.getElementById("presentation").requestFullscreen();
            else await document.exitFullscreen();
          } catch (err) {
            console.log("전체 화면 모드를 사용할 수 없습니다.", err);
          }
        });

      /* Keyboard */
      document.addEventListener("keydown", (e) => {
        if (e.target.closest("button") && (e.key === " " || e.key === "Enter"))
          return;
        switch (e.key) {
          case "ArrowRight":
          case "ArrowDown":
          case "PageDown":
          case " ":
            e.preventDefault();
            next();
            break;
          case "ArrowLeft":
          case "ArrowUp":
          case "PageUp":
            e.preventDefault();
            prev();
            break;
          case "Home":
            goTo(0);
            break;
          case "End":
            goTo(total - 1);
            break;
          case "f":
          case "F":
            document.getElementById("fullscreen").click();
            break;
          case "p":
          case "P":
            playBtn.click();
            break;
        }
      });

      /* Mouse wheel */
      let wheelLock = false;
      document.addEventListener(
        "wheel",
        (e) => {
          if (wheelLock || Math.abs(e.deltaY) < 30) return;
          wheelLock = true;
          e.deltaY > 0 ? next() : prev();
          setTimeout(() => (wheelLock = false), 1100);
        },
        { passive: true },
      );

      /* Touch swipe (faqat gorizontal harakat) */
      let tx = 0,
        ty = 0;
      document.addEventListener(
        "touchstart",
        (e) => {
          tx = e.changedTouches[0].screenX;
          ty = e.changedTouches[0].screenY;
        },
        { passive: true },
      );
      document.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].screenX - tx;
          const dy = e.changedTouches[0].screenY - ty;
          if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy)) return;
          dx < 0 ? next() : prev();
        },
        { passive: true },
      );

      /* Mouse parallax */
      const pres = document.getElementById("presentation");
      pres.addEventListener("mousemove", (e) => {
        const x = (e.clientX / innerWidth - 0.5) * 2;
        const y = (e.clientY / innerHeight - 0.5) * 2;
        pres.style.setProperty("--mx", x.toFixed(3));
        pres.style.setProperty("--my", y.toFixed(3));
      });

      /* Hash change (qo'lda #3 yozilganda) */
      window.addEventListener("hashchange", () => {
        const n = parseInt(location.hash.slice(1), 10);
        if (n >= 1 && n <= total) goTo(n - 1);
      });

      /* =========================================================
   INIT
   ========================================================= */
      const startIndex = (() => {
        const n = parseInt(location.hash.slice(1), 10);
        return n >= 1 && n <= total ? n - 1 : 0;
      })();

      slides.forEach((s) => {
        s.inert = true;
      });

      window.addEventListener("load", () => {
        setTimeout(() => {
          document.getElementById("loader").classList.add("hide");
          goTo(startIndex, false);
        }, 700);
      });

      // Zaxira: load hodisasi kechiksa ham loader yopilsin
      setTimeout(() => {
        if (current === -1) {
          document.getElementById("loader").classList.add("hide");
          goTo(startIndex, false);
        }
      }, 4000);
    </script>
  </body>
