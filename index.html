<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>튀르키예 | A Cinematic Journey</title>
    <meta name="theme-color" content="#0a0e13" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0e13;
        --ink: #f3ede1;
        --soft: rgba(243, 237, 225, 0.74);
        --gold: #d9b26f;
        --gold-soft: rgba(217, 178, 111, 0.38);
        --clay: #c8694a;
        --ease: cubic-bezier(0.77, 0, 0.18, 1);
        --out: cubic-bezier(0.16, 0.8, 0.2, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
        font-family: "DM Sans", "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      @media (hover: hover) {
        * {
          cursor: none !important;
        }
      }
      .grain,
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 60;
      }
      .grain {
        opacity: 0.09;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        animation: grain 1s steps(6) infinite;
      }
      @keyframes grain {
        0% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-3%, 2%);
        }
        40% {
          transform: translate(2%, -3%);
        }
        60% {
          transform: translate(-2%, -1%);
        }
        80% {
          transform: translate(3%, 3%);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      .vignette {
        background: radial-gradient(
          ellipse at center,
          transparent 60%,
          rgba(0, 0, 0, 0.42) 100%
        );
      }
      #dust {
        position: fixed;
        inset: 0;
        z-index: 26;
        pointer-events: none;
      }
      .cursor,
      .cdot {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 70;
        border-radius: 50%;
      }
      .cursor {
        width: 38px;
        height: 38px;
        margin: -19px 0 0 -19px;
        border: 1px solid var(--gold);
        transition:
          width 0.35s var(--out),
          height 0.35s var(--out),
          margin 0.35s var(--out),
          background 0.3s;
        mix-blend-mode: difference;
      }
      .cursor.big {
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        background: rgba(217, 178, 111, 0.2);
      }
      .cursor.down {
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        background: rgba(217, 178, 111, 0.5);
      }
      .cdot {
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        background: var(--gold);
      }
      @media (hover: none) {
        .cursor,
        .cdot {
          display: none;
        }
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        clip-path: inset(0);
        transition:
          clip-path 1.2s var(--ease),
          visibility 1.2s;
      }
      .loader.hide {
        clip-path: inset(0 0 100% 0);
        visibility: hidden;
      }
      .loader b {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 400;
        font-size: clamp(48px, 10vw, 120px);
        color: var(--gold);
      }
      .loader .lb {
        width: 200px;
        height: 1px;
        background: rgba(255, 255, 255, 0.15);
        position: relative;
        overflow: hidden;
      }
      .loader .lb i {
        position: absolute;
        inset: 0;
        background: var(--gold);
        transform-origin: left;
        transform: scaleX(0);
        transition: transform 0.4s ease;
      }
      .loader small {
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--soft);
      }
      .header {
        position: fixed;
        z-index: 30;
        top: 0;
        left: 0;
        right: 0;
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4.5%;
        background: linear-gradient(180deg, rgba(8, 11, 15, 0.55), transparent);
      }
      .brand {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .brand span {
        color: var(--gold);
      }
      .h-right {
        display: flex;
        align-items: center;
        gap: 26px;
        font-size: 11px;
        letter-spacing: 2px;
      }
      .counter em {
        font-style: normal;
        color: var(--gold);
      }
      .tbtn {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 10px;
        letter-spacing: 2px;
        opacity: 0.85;
        transition: opacity 0.3s;
      }
      .tbtn:hover,
      .tbtn.on {
        opacity: 1;
      }
      .tbtn.on .tag {
        color: var(--gold);
      }
      .bars {
        display: flex;
        gap: 2px;
        align-items: flex-end;
        height: 14px;
      }
      .bars i {
        width: 2px;
        height: 4px;
        background: var(--gold);
      }
      .tbtn.on .bars i {
        animation: eq 1s ease-in-out infinite;
      }
      .bars i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .bars i:nth-child(3) {
        animation-delay: 0.4s;
      }
      .bars i:nth-child(4) {
        animation-delay: 0.1s;
      }
      @keyframes eq {
        0%,
        100% {
          height: 3px;
        }
        50% {
          height: 14px;
        }
      }
      .timeline {
        position: fixed;
        z-index: 30;
        left: 2.2%;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .tl {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 0;
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--soft);
      }
      .tl i {
        display: block;
        width: 14px;
        height: 1px;
        background: currentColor;
        transition: width 0.5s var(--out);
      }
      .tl span {
        opacity: 0;
        transform: translateX(-8px);
        transition: all 0.4s var(--out);
        white-space: nowrap;
      }
      .tl:hover span,
      .tl.active span {
        opacity: 1;
        transform: none;
      }
      .tl.active {
        color: var(--gold);
      }
      .tl.active i {
        width: 38px;
      }
      .tl:hover i {
        width: 30px;
      }
      .footer {
        position: fixed;
        z-index: 30;
        left: 0;
        right: 0;
        bottom: 0;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4.5%;
        background: linear-gradient(0deg, rgba(8, 11, 15, 0.5), transparent);
      }
      .hint {
        font-size: 10px;
        letter-spacing: 2.5px;
        color: var(--soft);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .hint::before {
        content: "";
        width: 46px;
        height: 1px;
        background: var(--gold);
      }
      .ctrl {
        display: flex;
        gap: 10px;
      }
      .cbtn {
        width: 42px;
        height: 42px;
        border: 1px solid rgba(243, 237, 225, 0.45);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 15px;
        transition:
          background 0.3s,
          color 0.3s,
          border-color 0.3s;
      }
      .cbtn:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: #111;
      }
      .cbtn:focus-visible,
      .tl:focus-visible,
      .tbtn:focus-visible,
      .restart:focus-visible,
      .chip:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
      .pbar {
        position: fixed;
        z-index: 31;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 0;
        background: var(--gold);
        transition: width 1s var(--ease);
      }

      #stage {
        position: fixed;
        inset: 0;
      }
      .slide {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
        clip-path: var(--from, inset(100% 0 0 0));
        transition: clip-path 1.15s var(--ease);
        background: var(--bg);
      }
      .slide.active,
      .slide.enter,
      .slide.under {
        visibility: visible;
      }
      .slide.active {
        clip-path: inset(0);
        z-index: 3;
      }
      .slide.under {
        clip-path: inset(0);
        z-index: 2;
      }
      .bg {
        position: absolute;
        inset: -3%;
        background: linear-gradient(135deg, #1d3a46, var(--tint, #6b5744));
        transform: translate3d(
          calc(var(--mx, 0) * -16px),
          calc(var(--my, 0) * -10px),
          0
        );
        transition: transform 0.6s ease-out;
      }
      .bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.16);
        transition: transform 12s cubic-bezier(0.2, 0.6, 0.3, 1);
      }
      .slide.active .bg img {
        transform: scale(1.02);
      }
      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(8, 11, 15, 0.78) 0%,
            rgba(8, 11, 15, 0.34) 55%,
            rgba(8, 11, 15, 0.08) 100%
          ),
          linear-gradient(0deg, rgba(8, 11, 15, 0.55), transparent 38%);
      }
      .blur .bg img,
      .place .bg img {
        filter: blur(30px) brightness(0.72) saturate(1.4);
        transform: scale(1.3);
      }
      .slide.active.blur .bg img,
      .slide.active.place .bg img {
        transform: scale(1.2);
      }
      .blur .bg::after,
      .place .bg::after {
        background: linear-gradient(
          90deg,
          rgba(8, 11, 15, 0.5),
          rgba(8, 11, 15, 0.2)
        );
      }
      .glow {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.42;
        mix-blend-mode: screen;
        background: radial-gradient(
          circle at 72% 45%,
          var(--tint, #d9b26f),
          transparent 55%
        );
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--gold);
        margin-bottom: 24px;
      }
      .eyebrow::before {
        content: "";
        width: 40px;
        height: 1px;
        background: currentColor;
      }
      .title {
        font-family: "Noto Serif KR", serif;
        font-weight: 600;
        font-size: clamp(36px, 5.4vw, 82px);
        line-height: 1.18;
        letter-spacing: -1.5px;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.35);
      }
      .ln {
        display: block;
        overflow: hidden;
        padding: 0.04em 0.12em 0.14em 0;
        margin-bottom: -0.06em;
      }
      .w {
        display: inline-block;
        white-space: nowrap;
      }
      .ch {
        display: inline-block;
        transform: translateY(115%) rotate(7deg);
        opacity: 0;
        transition:
          transform 1s var(--out),
          opacity 0.8s ease;
        transition-delay: calc(var(--i) * 28ms + 350ms);
      }
      .slide.active .ch {
        transform: none;
        opacity: 1;
      }
      .ln.em {
        color: var(--gold);
      }
      .ln.lat {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -2px;
        font-size: 1.18em;
      }
      .ln.lat .ch {
        font-family: inherit;
      }
      .desc {
        max-width: 540px;
        margin-top: 24px;
        font-weight: 300;
        font-size: clamp(15px, 1.4vw, 19px);
        line-height: 1.9;
        color: var(--soft);
        word-break: keep-all;
      }
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 1s ease,
          transform 1s var(--out);
      }
      .slide.active .reveal {
        opacity: 1;
        transform: none;
      }
      .d1 {
        transition-delay: 0.3s;
      }
      .d2 {
        transition-delay: 0.6s;
      }
      .d3 {
        transition-delay: 0.85s;
      }
      .d4 {
        transition-delay: 1.1s;
      }

      /* keyword chips */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }
      .chip {
        padding: 14px 26px;
        border: 1px solid var(--gold-soft);
        border-radius: 40px;
        font-family: "Noto Serif KR", serif;
        font-weight: 600;
        font-size: clamp(15px, 1.5vw, 19px);
        background: rgba(10, 14, 19, 0.42);
        backdrop-filter: blur(8px);
        transition:
          transform 0.4s var(--out),
          background 0.3s,
          color 0.3s,
          border-color 0.3s;
      }
      .chip:hover {
        border-color: var(--gold);
        transform: translateY(-4px);
      }
      .chip.on {
        background: var(--gold);
        color: #111;
        border-color: var(--gold);
      }
      .chip::after {
        content: " +";
        opacity: 0.6;
        font-weight: 400;
      }
      .chip.on::after {
        content: " −";
      }
      .info {
        margin-top: 22px;
        min-height: 70px;
        max-width: 480px;
        padding-left: 18px;
        border-left: 2px solid var(--gold);
        font-weight: 300;
        font-size: clamp(15px, 1.4vw, 19px);
        line-height: 1.8;
        word-break: keep-all;
        opacity: 0;
        transform: translateY(12px);
        transition: 0.5s var(--out);
      }
      .info.show {
        opacity: 1;
        transform: none;
      }
      .info small {
        display: block;
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 3px;
        margin-bottom: 6px;
      }

      /* hero */
      .hero .wrap,
      .closing .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px 9%;
      }
      .hero .title {
        font-size: clamp(44px, 8vw, 128px);
        line-height: 1.08;
      }
      .hero-meta {
        position: absolute;
        left: 9%;
        right: 6%;
        bottom: 128px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        font-size: 10px;
        letter-spacing: 2.5px;
        color: var(--soft);
        z-index: 3;
      }
      .hero-meta b {
        display: block;
        color: var(--ink);
        font-weight: 500;
        margin-top: 6px;
        letter-spacing: 1.5px;
        font-size: 12px;
      }
      .hero-meta div + div {
        text-align: right;
      }
      .ribbon {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 76px;
        z-index: 3;
        overflow: hidden;
        white-space: nowrap;
        border-top: 1px solid var(--gold-soft);
        border-bottom: 1px solid var(--gold-soft);
        padding: 10px 0;
        background: rgba(8, 11, 15, 0.35);
        backdrop-filter: blur(4px);
      }
      .ribbon div {
        display: inline-block;
        animation: slide 32s linear infinite;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 20px;
        color: var(--gold);
        letter-spacing: 2px;
      }
      .ribbon span {
        margin: 0 28px;
        color: var(--ink);
        opacity: 0.5;
      }
      @keyframes slide {
        to {
          transform: translateX(-50%);
        }
      }

      /* place */
      .place .wrap {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        align-items: center;
        gap: 6%;
        padding: 100px 9% 90px;
      }
      .place.flip .wrap {
        grid-template-columns: 0.95fr 1.05fr;
      }
      .place.flip .arch-wrap {
        order: -1;
      }
      .ghost {
        position: absolute;
        left: -1%;
        bottom: -6%;
        z-index: 1;
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 600;
        font-size: clamp(150px, 24vw, 380px);
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 1px rgba(217, 178, 111, 0.3);
        transform: translateX(-5%);
        transition: transform 2.4s var(--out);
      }
      .slide.active .ghost {
        transform: none;
      }
      .place.flip .ghost {
        left: auto;
        right: -1%;
      }
      .arch-wrap {
        position: relative;
        width: min(100%, 440px);
        justify-self: center;
        margin: 0;
      }
      .arch-wrap::before {
        content: "";
        position: absolute;
        inset: -14px;
        border: 1px solid var(--gold-soft);
        border-radius: 999px 999px 0 0;
        transition: inset 1.6s var(--out);
      }
      .slide.active .arch-wrap::before {
        inset: -18px;
      }
      .arch {
        position: relative;
        width: 100%;
        height: min(64vh, 580px);
        overflow: hidden;
        border-radius: 999px 999px 0 0;
        background: linear-gradient(160deg, #33414a, var(--tint, #6b5744));
        box-shadow: 0 50px 90px -30px rgba(0, 0, 0, 0.8);
        transform: perspective(900px) rotateY(calc(var(--mx, 0) * 7deg))
          rotateX(calc(var(--my, 0) * -5deg));
        transition: transform 0.7s ease-out;
      }
      .arch img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.2);
        transition: transform 10s cubic-bezier(0.2, 0.6, 0.3, 1);
      }
      .slide.active .arch img {
        transform: scale(1.03);
      }
      .arch::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          rgba(8, 11, 15, 0.35),
          transparent 40%
        );
      }
      .arch-wrap figcaption {
        position: absolute;
        left: 50%;
        bottom: -44px;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--soft);
        white-space: nowrap;
      }

      /* closing + map */
      .closing .wrap {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        align-items: center;
        gap: 3%;
        padding: 100px 7% 90px 9%;
      }
      .mapbox {
        position: relative;
        background-image: radial-gradient(
          rgba(217, 178, 111, 0.25) 1px,
          transparent 1.4px
        );
        background-size: 22px 22px;
        border: 1px solid var(--gold-soft);
        padding: 10px;
        background-color: rgba(10, 16, 22, 0.6);
        backdrop-filter: blur(4px);
      }
      .mapbox svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .outline {
        fill: rgba(217, 178, 111, 0.07);
        stroke: var(--gold);
        stroke-width: 1.2;
        stroke-linejoin: round;
        stroke-dasharray: 3000;
        stroke-dashoffset: 3000;
        transition:
          stroke-dashoffset 3s var(--ease) 0.4s,
          fill 1.5s ease 2s;
      }
      .slide.active .outline {
        stroke-dashoffset: 0;
        fill: rgba(217, 178, 111, 0.13);
      }
      .route {
        fill: none;
        stroke: var(--clay);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        transition: stroke-dashoffset 4s ease-in-out 1.6s;
      }
      .slide.active .route {
        stroke-dashoffset: 0;
      }
      .pin {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .slide.active .pin {
        opacity: 1;
      }
      .pin circle.c {
        fill: var(--bg);
        stroke: var(--gold);
        stroke-width: 2;
      }
      .pin circle.p {
        fill: none;
        stroke: var(--gold);
        stroke-width: 1;
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          r: 6;
          opacity: 0.9;
        }
        100% {
          r: 22;
          opacity: 0;
        }
      }
      .pin text {
        fill: var(--ink);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        letter-spacing: 2px;
        font-weight: 700;
      }
      .pin text.k {
        fill: var(--gold);
        font-family: "Noto Sans KR", sans-serif;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .plane {
        fill: var(--gold);
        opacity: 0;
      }
      .slide.active .plane {
        opacity: 1;
        transition: opacity 0.5s 1.6s;
      }
      .restart {
        margin-top: 30px;
        align-self: flex-start;
        padding: 15px 30px;
        border: 1px solid var(--gold);
        border-radius: 40px;
        font-size: 11px;
        letter-spacing: 2.5px;
        color: var(--gold);
        transition: all 0.35s;
      }
      .restart:hover {
        background: var(--gold);
        color: #111;
      }

      /* ===== WOW effects ===== */
      .spot {
        position: fixed;
        inset: 0;
        z-index: 25;
        pointer-events: none;
        mix-blend-mode: screen;
        background: radial-gradient(
          520px circle at calc(var(--sx, 50) * 1%) calc(var(--sy, 50) * 1%),
          rgba(217, 178, 111, 0.16),
          transparent 60%
        );
      }
      .fx {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
      }
      .fx i {
        position: absolute;
        display: block;
      }
      .bl {
        bottom: -90px;
        width: 36px;
        height: 44px;
        border-radius: 50% 50% 46% 46%;
        background: var(--c);
        box-shadow: inset -6px -6px 12px rgba(0, 0, 0, 0.25);
        animation: rise var(--t) linear infinite;
        animation-delay: var(--d);
        opacity: 0.9;
      }
      .bl::after {
        content: "";
        position: absolute;
        left: 12px;
        bottom: -12px;
        width: 12px;
        height: 8px;
        background: #3a2a1d;
      }
      @keyframes rise {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(60px, -125vh);
        }
      }
      .bb {
        bottom: -30px;
        border-radius: 50%;
        width: var(--s);
        height: var(--s);
        background: rgba(255, 255, 255, 0.4);
        animation: rise2 var(--t) ease-in infinite;
        animation-delay: var(--d);
      }
      @keyframes rise2 {
        from {
          transform: translateY(0);
          opacity: 0;
        }
        20% {
          opacity: 0.8;
        }
        to {
          transform: translateY(-95vh);
          opacity: 0;
        }
      }
      .bd {
        left: -6%;
        top: var(--y);
        animation: fly var(--t) linear infinite;
        animation-delay: var(--d);
      }
      @keyframes fly {
        from {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(55vw, -26px);
        }
        to {
          transform: translate(115vw, 10px);
        }
      }
      .wv {
        left: 0;
        bottom: 0;
        width: 200%;
        height: 150px;
        animation: wave var(--t) linear infinite;
      }
      .wv svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      @keyframes wave {
        to {
          transform: translateX(-50%);
        }
      }
      .chip {
        animation: glow 3s ease-in-out infinite;
      }
      .chip.on {
        animation: none;
      }
      @keyframes glow {
        50% {
          box-shadow: 0 0 24px rgba(217, 178, 111, 0.4);
        }
      }
      .title {
        background: linear-gradient(100deg, #fff 40%, #f3d9a0);
        -webkit-background-clip: text;
        background-clip: text;
      }
      /* ===== + button: info opens inside ===== */
      .fx {
        z-index: 2;
      }
      .bl::after {
        left: 50%;
        margin-left: -6px;
      }
      .chip {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
      }
      .chip::after,
      .chip.on::after {
        content: none;
      }
      .chip em {
        font-style: normal;
        font-weight: 400;
        opacity: 0.6;
        margin-left: 8px;
      }
      .chip .ci {
        display: none;
        margin-top: 10px;
        max-width: 250px;
        font:
          300 clamp(15px, 1.4vw, 18px)/1.7 "Noto Sans KR",
          sans-serif;
        color: var(--ink);
        word-break: keep-all;
      }
      .chip.on {
        background: rgba(10, 14, 19, 0.8);
        border-color: var(--gold);
        color: var(--gold);
        border-radius: 24px;
        animation: none;
        transform: none;
      }
      .chip.on em {
        opacity: 1;
      }
      .chip.on .ci {
        display: block;
        animation: pop 0.5s var(--out);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (max-width: 900px) {
        .header {
          height: 64px;
        }
        .timeline,
        .hint,
        .tbtn .tag {
          display: none;
        }
        .h-right {
          gap: 14px;
        }
        .footer {
          height: 66px;
        }
        .cbtn {
          width: 38px;
          height: 38px;
        }
        .title {
          font-size: clamp(30px, 8.6vw, 52px);
          letter-spacing: -1px;
        }
        .hero .title {
          font-size: clamp(40px, 12vw, 76px);
        }
        .hero .wrap {
          padding: 90px 7% 100px;
        }
        .hero-meta {
          left: 7%;
          right: 7%;
          bottom: 120px;
          flex-direction: column;
          align-items: flex-start;
        }
        .hero-meta div + div {
          text-align: left;
        }
        .ribbon {
          bottom: 66px;
        }
        .place .wrap,
        .place.flip .wrap,
        .closing .wrap {
          grid-template-columns: 1fr;
          gap: 30px;
          padding: 84px 7%;
          align-content: center;
          overflow-y: auto;
        }
        .arch-wrap,
        .place.flip .arch-wrap {
          order: -1;
          width: 52%;
        }
        .arch {
          height: 26vh;
        }
        .arch-wrap figcaption {
          display: none;
        }
        .chip {
          padding: 11px 18px;
        }
        .chips {
          margin-top: 20px;
        }
        .ghost {
          font-size: 120px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          transition-delay: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <div class="vignette"></div>
    <canvas id="dust"></canvas>
    <div class="spot"></div>
    <div class="cursor" id="cursor"></div>
    <div class="cdot" id="cdot"></div>
    <div class="loader" id="loader">
      <b>Türkiye</b>
      <div class="lb"><i id="lbar"></i></div>
      <small id="lpct">0%</small>
    </div>
    <header class="header">
      <div class="brand">FIELDNOTES <span>/ TÜRKİYE</span></div>
      <div class="h-right">
        <button class="tbtn" id="auto" aria-label="자동 재생">
          <span class="tag">AUTO</span><span id="autoIc">▶</span>
        </button>
        <button class="tbtn" id="sound" aria-label="배경 사운드">
          <span class="tag">SOUND</span>
          <div class="bars"><i></i><i></i><i></i><i></i></div>
        </button>
        <div class="counter" id="counter" aria-live="polite">
          <em>01</em> / 06
        </div>
      </div>
    </header>
    <nav class="timeline" id="timeline" aria-label="슬라이드 이동"></nav>
    <main
      id="stage"
      role="region"
      aria-roledescription="carousel"
      aria-label="튀르키예 여행 프레젠테이션"
    ></main>
    <footer class="footer">
      <div class="hint">SCROLL · ← → · SWIPE</div>
      <div class="ctrl">
        <button class="cbtn mag" id="prev" aria-label="이전">←</button>
        <button class="cbtn mag" id="next" aria-label="다음">→</button>
        <button class="cbtn mag" id="full" aria-label="전체 화면">⛶</button>
      </div>
    </footer>
    <div class="pbar" id="pbar"></div>

    <script>
      const U = (id, w = 2000) =>
        `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`;

      /* ====== 내용 (짧은 키워드 + 클릭하면 한 줄 설명) ====== */
      const places = [
        {
          key: "ISTANBUL",
          ghost: "Istanbul",
          tint: "#b9683f",
          lab: "41.01°N · 28.98°E",
          img: U("photo-1541432901042-2d8bd64b4a9b", 1400),
          alt: "이스탄불",
          eyebrow: "01 — HISTORY",
          lines: ["역사의 도시", "이스탄불"],
          kw: [
            ["아야 소피아", "1500년 된 큰 건물이에요."],
            ["블루 모스크", "파란 타일이 정말 예뻐요."],
            ["보스포루스", "두 대륙 사이의 바다예요."],
          ],
        },
        {
          key: "CAPPADOCIA",
          ghost: "Göreme",
          tint: "#d98a4e",
          lab: "38.64°N · 34.83°E",
          img: U("photo-1570939274717-7eda259b50ed", 1400),
          alt: "카파도키아",
          eyebrow: "02 — ADVENTURE",
          lines: ["하늘의 풍경", "카파도키아"],
          kw: [
            ["열기구", "아침 하늘에 수백 개가 떠요."],
            ["신기한 바위", "버섯처럼 생긴 바위가 많아요."],
            ["동굴 호텔", "바위 속에서 잘 수 있어요."],
          ],
        },
        {
          key: "PAMUKKALE",
          ghost: "Pamukkale",
          tint: "#4aa7b5",
          lab: "37.92°N · 29.12°E",
          img: U("photo-1600255821058-c4f3f3d8f7f2", 1400),
          alt: "파묵칼레",
          eyebrow: "03 — NATURE",
          lines: ["하얀 온천", "파묵칼레"],
          kw: [
            ["하얀 계단", "온천물이 만든 하얀 땅이에요."],
            ["히에라폴리스", "옆에 있는 아주 오래된 도시예요."],
            ["족욕", "따뜻한 물에 발을 담가요."],
          ],
        },
        {
          key: "ANTALYA",
          ghost: "Antalya",
          tint: "#2d8fb8",
          lab: "36.90°N · 30.71°E",
          img: U("photo-1533105079780-92b9be482077", 1400),
          alt: "안탈리아",
          eyebrow: "04 — SEA",
          lines: ["푸른 바다", "안탈리아"],
          kw: [
            ["지중해", "맑고 푸른 바다예요."],
            ["칼레이치", "예쁜 옛 골목이 있어요."],
            ["휴식", "편하게 쉬기 좋아요."],
          ],
        },
      ];
      const hero = {
        img: U("photo-1524231757912-21f4fe3a7200", 2200),
        alt: "이스탄불",
      };
      const end = {
        img: U("photo-1544787219-7f47ccb76574", 2200),
        alt: "튀르키예의 차 한 잔",
      };
      const names = ["INTRO", ...places.map((p) => p.key), "THANK YOU"];

      /* ====== helpers ====== */
      function split(lines) {
        let n = 0;
        return lines
          .map((l, li) => {
            const em = li === lines.length - 1 && lines.length > 1,
              lat = /^[\x00-\u024F ]+$/.test(l);
            const words = l
              .split(" ")
              .map(
                (w) =>
                  `<span class="w">${[...w].map((c) => `<span class="ch" style="--i:${n++}">${c}</span>`).join("")}</span>`,
              )
              .join(" ");
            return `<span class="ln${em ? " em" : ""}${lat ? " lat" : ""}">${words}</span>`;
          })
          .join("");
      }
      const im = (s, a) =>
        `<img src="${s}" alt="${a}" decoding="async" onerror="this.remove()">`;
      const chips = (kw) =>
        `<div class="chips reveal d2">${kw.map((k, j) => `<button class="chip" aria-expanded="false"><span class="cw">${k[0]}<em>+</em></span><span class="ci">${k[1]}</span></button>`).join("")}</div>`;

      /* 지도 */
      const OUT = [
        [26.05, 41.75],
        [26.6, 41.95],
        [28.0, 41.98],
        [29.1, 41.2],
        [30.5, 41.2],
        [31.5, 41.15],
        [33.0, 42.0],
        [34.5, 42.0],
        [35.15, 42.03],
        [36.5, 41.3],
        [38.0, 40.95],
        [39.7, 41.1],
        [41.5, 41.5],
        [43.4, 41.1],
        [43.7, 40.1],
        [44.3, 39.4],
        [44.0, 38.4],
        [44.6, 37.2],
        [42.4, 37.1],
        [41.0, 37.1],
        [39.0, 36.7],
        [38.0, 36.8],
        [36.7, 36.7],
        [36.1, 36.3],
        [36.0, 35.9],
        [35.4, 36.6],
        [34.0, 36.2],
        [32.5, 36.1],
        [31.0, 36.8],
        [30.5, 36.2],
        [29.2, 36.3],
        [28.2, 36.7],
        [27.4, 37.0],
        [27.3, 37.6],
        [26.4, 38.2],
        [26.8, 39.0],
        [26.2, 39.5],
        [26.2, 40.0],
        [26.8, 40.4],
        [27.5, 40.35],
        [28.4, 40.4],
        [29.2, 40.7],
        [29.0, 41.0],
        [28.0, 41.0],
        [27.0, 40.9],
        [26.2, 40.5],
        [26.1, 41.1],
      ];
      const PX = (lo, la) => [(lo - 25.3) * 46.8 + 14, (42.4 - la) * 60 + 14];
      const outlineD =
        "M" +
        OUT.map(([a, b]) =>
          PX(a, b)
            .map((n) => n.toFixed(1))
            .join(" "),
        ).join(" L") +
        " Z";
      const pts = [
        [28.98, 41.01, "ISTANBUL", "이스탄불", "r"],
        [34.83, 38.64, "CAPPADOCIA", "카파도키아", "l"],
        [29.12, 37.92, "PAMUKKALE", "파묵칼레", "l"],
        [30.71, 36.9, "ANTALYA", "안탈리아", "r"],
      ].map(([lo, la, n, k, side]) => ({ xy: PX(lo, la), n, k, side }));
      let routeD = "M" + pts[0].xy.join(" ");
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1].xy,
          [x1, y1] = pts[i].xy;
        routeD += ` Q${((x0 + x1) / 2).toFixed(1)} ${(Math.min(y0, y1) - 48).toFixed(1)} ${x1} ${y1}`;
      }
      const mapSVG = `<svg viewBox="0 0 960 430" aria-label="여행 경로 지도"><path class="outline" d="${outlineD}"/><path class="route" id="route" d="${routeD}"/>
${pts.map((p, i) => `<g class="pin" style="transition-delay:${(1.2 + i * 1.1).toFixed(1)}s" transform="translate(${p.xy[0].toFixed(1)} ${p.xy[1].toFixed(1)})"><circle class="p" r="6"/><circle class="c" r="6"/><text x="${p.side === "r" ? 16 : -16}" y="-4" text-anchor="${p.side === "r" ? "start" : "end"}">${p.n}</text><text class="k" x="${p.side === "r" ? 16 : -16}" y="14" text-anchor="${p.side === "r" ? "start" : "end"}">${p.k}</text></g>`).join("")}
<g class="plane"><path d="M0-7 L5 6 L0 3 L-5 6Z" transform="rotate(90)"/><animateMotion dur="9s" begin="1.8s" repeatCount="indefinite" rotate="auto" path="${routeD}"/></g></svg>`;

      /* ====== 효과 ====== */
      const bird = (y, t, d) =>
        `<i class="bd" style="--y:${y}%;--t:${t}s;--d:${d}s"><svg width="28" height="12" viewBox="0 0 26 12"><path d="M1 10 Q7 0 13 8 Q19 0 25 10" fill="none" stroke="#f3ede1" stroke-width="1.6"><animate attributeName="d" dur=".9s" repeatCount="indefinite" values="M1 10 Q7 0 13 8 Q19 0 25 10;M1 4 Q7 8 13 10 Q19 8 25 4;M1 10 Q7 0 13 8 Q19 0 25 10"/></path></svg></i>`;
      const wave = (o, t, c) =>
        `<i class="wv" style="--t:${t}s;opacity:${o}"><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60 V120 H0Z" fill="${c}"/></svg></i>`;
      const cols = ["#d9b26f", "#e8a07a", "#9fd3dc", "#e8e0cf", "#c8694a"];
      const FX = {
        ISTANBUL: () =>
          [
            [12, 22, 0],
            [22, 28, -9],
            [32, 24, -15],
            [18, 30, -4],
            [40, 20, -5],
          ]
            .map((a) => bird(...a))
            .join(""),
        CAPPADOCIA: () =>
          cols
            .map(
              (c, i) =>
                `<i class="bl" style="left:${8 + i * 18}%;--c:${c};--t:${22 + i * 5}s;--d:${-i * 7}s;width:${30 + (i % 3) * 10}px;height:${38 + (i % 3) * 12}px"></i>`,
            )
            .join(""),
        PAMUKKALE: () =>
          Array.from(
            { length: 14 },
            (_, i) =>
              `<i class="bb" style="left:${(i * 7 + 5) % 95}%;--s:${6 + (i % 4) * 5}px;--t:${8 + (i % 5) * 2}s;--d:${-i * 1.3}s"></i>`,
          ).join(""),
        ANTALYA: () =>
          wave(0.35, 14, "#2d8fb8") +
          wave(0.55, 9, "#1d6f94") +
          wave(0.8, 6, "#0f4f6c"),
      };

      /* ====== 슬라이드 6개 ====== */
      const S = [];
      const rib = ["ISTANBUL", "CAPPADOCIA", "PAMUKKALE", "ANTALYA"]
        .map((t) => `<span>✦</span>${t}`)
        .join("");
      S.push(`<section class="slide hero" style="--tint:#b9683f"><div class="bg">${im(hero.img, hero.alt)}</div>
<div class="wrap"><div class="eyebrow reveal d1">DISCOVER TÜRKİYE · 2026</div>
<h1 class="title">${split(["두 대륙이 만나는 곳", "Türkiye"])}</h1>
<p class="desc reveal d2">네 도시를 소개할게요.</p></div>
<div class="hero-meta reveal d4"><div>FOUR DESTINATIONS<b>이스탄불 → 카파도키아 → 파묵칼레 → 안탈리아</b></div><div>41.01°N · 28.98°E<b>BEGIN IN ISTANBUL</b></div></div>
<div class="ribbon"><div>${rib}${rib}${rib}${rib}</div></div></section>`);

      places.forEach((p, i) =>
        S.push(`<section class="slide place ${i % 2 ? "flip" : ""}" style="--tint:${p.tint}">
<div class="bg">${im(p.img, p.alt)}</div><div class="glow"></div><div class="fx">${FX[p.key](p.kw)}</div><div class="ghost">${p.ghost}</div>
<div class="wrap"><div><div class="eyebrow reveal d1">${p.eyebrow}</div><h2 class="title">${split(p.lines)}</h2>${chips(p.kw)}</div>
<figure class="arch-wrap reveal d1"><div class="arch">${im(p.img, p.alt)}</div><figcaption>${p.lab}</figcaption></figure></div></section>`),
      );

      S.push(`<section class="slide closing blur" style="--tint:#2d8fb8"><div class="bg">${im(end.img, end.alt)}</div><div class="glow"></div>
<div class="wrap"><div><div class="eyebrow reveal d1">THE END · 05</div><h2 class="title">${split(["들어 주셔서", "감사합니다"])}</h2>
<p class="desc reveal d2">Teşekkür ederim!</p>
<button class="restart reveal d3" id="restart">↺ 처음부터 다시 보기</button></div>
<div class="mapbox reveal d2">${mapSVG}</div></div></section>`);

      const stage = document.getElementById("stage");
      stage.innerHTML = S.join("");
      const slides = [...stage.querySelectorAll(".slide")],
        total = slides.length;
      slides.forEach((s, i) => {
        s.setAttribute("role", "group");
        s.setAttribute("aria-roledescription", "slide");
        s.setAttribute("aria-label", `${i + 1} / ${total}`);
        s.inert = true;
      });

      /* + 누르면 버튼 안에서 설명이 열려요 */
      slides.forEach((s) => {
        const cs = [...s.querySelectorAll(".chip")];
        const shut = (x) => {
          x.classList.remove("on");
          x.querySelector("em").textContent = "+";
          x.setAttribute("aria-expanded", "false");
        };
        cs.forEach(
          (c) =>
            (c.onclick = () => {
              const on = c.classList.contains("on");
              cs.forEach(shut);
              if (on) return;
              c.classList.add("on");
              c.querySelector("em").textContent = "−";
              c.setAttribute("aria-expanded", "true");
            }),
        );
      });

      const routeEl = document.getElementById("route");
      routeEl.style.setProperty(
        "--len",
        Math.ceil(routeEl.getTotalLength()) + 5,
      );
      const tl = document.getElementById("timeline");
      tl.innerHTML = names
        .map(
          (n, i) =>
            `<button class="tl" data-i="${i}" aria-label="${n}"><i></i><span>${String(i + 1).padStart(2, "0")} · ${n}</span></button>`,
        )
        .join("");
      const tlBtns = [...tl.children];

      /* ====== 이동 ====== */
      let cur = -1,
        busy = false,
        autoOn = false,
        autoT = null;
      const counter = document.getElementById("counter"),
        pbar = document.getElementById("pbar");
      function goTo(i) {
        if (busy || i === cur || i < 0 || i >= total) return;
        busy = true;
        const old = slides[cur],
          nw = slides[i],
          dir = cur === -1 || i > cur ? 1 : -1;
        nw.style.setProperty(
          "--from",
          dir > 0 ? "inset(100% 0 0 0)" : "inset(0 0 100% 0)",
        );
        nw.classList.add("enter");
        void nw.offsetWidth;
        if (old) {
          old.classList.remove("active");
          old.classList.add("under");
          old.inert = true;
          old.querySelectorAll(".chip.on").forEach((x) => {
            x.classList.remove("on");
            x.querySelector("em").textContent = "+";
            x.setAttribute("aria-expanded", "false");
          });
          const oi = old.querySelector(".info");
          if (oi) oi.classList.remove("show");
        }
        nw.classList.add("active");
        nw.inert = false;
        cur = i;
        counter.innerHTML = `<em>${String(i + 1).padStart(2, "0")}</em> / ${String(total).padStart(2, "0")}`;
        pbar.style.width = ((i + 1) / total) * 100 + "%";
        tlBtns.forEach((b, k) => b.classList.toggle("active", k === i));
        try {
          history.replaceState(null, "", "#" + (i + 1));
        } catch (e) {}
        clearTimeout(autoT);
        if (autoOn) autoT = setTimeout(next, 9500);
        setTimeout(() => {
          if (old) old.classList.remove("under", "enter");
          nw.classList.remove("enter");
          busy = false;
        }, 1250);
      }
      const next = () => goTo((cur + 1) % total),
        prev = () => goTo((cur - 1 + total) % total);

      document.getElementById("next").onclick = next;
      document.getElementById("prev").onclick = prev;
      tlBtns.forEach((b) => (b.onclick = () => goTo(+b.dataset.i)));
      document.addEventListener("click", (e) => {
        if (e.target.closest("#restart")) goTo(0);
      });
      document.getElementById("full").onclick = async () => {
        try {
          document.fullscreenElement
            ? await document.exitFullscreen()
            : await document.documentElement.requestFullscreen();
        } catch (e) {}
      };
      const autoBtn = document.getElementById("auto");
      autoBtn.onclick = () => {
        autoOn = !autoOn;
        autoBtn.classList.toggle("on", autoOn);
        document.getElementById("autoIc").textContent = autoOn ? "❚❚" : "▶";
        clearTimeout(autoT);
        if (autoOn) autoT = setTimeout(next, 9500);
      };
      document.addEventListener("keydown", (e) => {
        if (e.target.closest("button") && (e.key === " " || e.key === "Enter"))
          return;
        const k = e.key;
        if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(k)) {
          e.preventDefault();
          next();
        } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(k)) {
          e.preventDefault();
          prev();
        } else if (/^[1-6]$/.test(k)) goTo(+k - 1);
        else if (k === "Home") goTo(0);
        else if (k === "End") goTo(total - 1);
        else if (k === "f" || k === "F")
          document.getElementById("full").click();
        else if (k === "m" || k === "M")
          document.getElementById("sound").click();
        else if (k === "a" || k === "A") autoBtn.click();
      });
      let wl = false;
      document.addEventListener(
        "wheel",
        (e) => {
          if (wl || Math.abs(e.deltaY) < 25) return;
          wl = true;
          e.deltaY > 0 ? next() : prev();
          setTimeout(() => (wl = false), 1400);
        },
        { passive: true },
      );
      let sx = 0,
        sy = 0;
      document.addEventListener(
        "touchstart",
        (e) => {
          sx = e.changedTouches[0].clientX;
          sy = e.changedTouches[0].clientY;
        },
        { passive: true },
      );
      document.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - sx,
            dy = e.changedTouches[0].clientY - sy;
          if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
          (dx < 0 ? next : prev)();
        },
        { passive: true },
      );
      window.addEventListener("hashchange", () => {
        const n = parseInt(location.hash.slice(1), 10);
        if (n >= 1 && n <= total) goTo(n - 1);
      });

      /* 커서 · 패럴랙스 · 자석 버튼 */
      const cursor = document.getElementById("cursor"),
        cdot = document.getElementById("cdot");
      let tx = innerWidth / 2,
        ty = innerHeight / 2,
        cx = tx,
        cy = ty;
      document.addEventListener("mousemove", (e) => {
        tx = e.clientX;
        ty = e.clientY;
        cdot.style.transform = `translate(${tx}px,${ty}px)`;
        document.body.style.setProperty(
          "--sx",
          ((tx / innerWidth) * 100).toFixed(1),
        );
        document.body.style.setProperty(
          "--sy",
          ((ty / innerHeight) * 100).toFixed(1),
        );
        stage.style.setProperty(
          "--mx",
          ((tx / innerWidth - 0.5) * 2).toFixed(3),
        );
        stage.style.setProperty(
          "--my",
          ((ty / innerHeight - 0.5) * 2).toFixed(3),
        );
      });
      document.addEventListener("mouseover", (e) =>
        cursor.classList.toggle("big", !!e.target.closest("button,[data-j]")),
      );
      document.addEventListener("mousedown", () =>
        cursor.classList.add("down"),
      );
      document.addEventListener("mouseup", () =>
        cursor.classList.remove("down"),
      );
      (function loop() {
        cx += (tx - cx) * 0.16;
        cy += (ty - cy) * 0.16;
        cursor.style.transform = `translate(${cx}px,${cy}px)`;
        requestAnimationFrame(loop);
      })();
      document.querySelectorAll(".mag").forEach((b) => {
        b.addEventListener("mousemove", (e) => {
          const r = b.getBoundingClientRect();
          b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.35}px,${(e.clientY - r.top - r.height / 2) * 0.35}px)`;
        });
        b.addEventListener("mouseleave", () => {
          b.style.transform = "";
        });
      });

      /* 금빛 먼지 */
      const cv = document.getElementById("dust"),
        g = cv.getContext("2d");
      let W, H;
      const P = [];
      function rs() {
        W = cv.width = innerWidth;
        H = cv.height = innerHeight;
      }
      rs();
      addEventListener("resize", rs);
      for (let i = 0; i < 70; i++)
        P.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 1.8 + 0.4,
          vy: -(Math.random() * 0.25 + 0.05),
          vx: (Math.random() - 0.5) * 0.15,
          a: Math.random() * 6.28,
        });
      (function dust() {
        g.clearRect(0, 0, W, H);
        const mx = parseFloat(stage.style.getPropertyValue("--mx")) || 0;
        P.forEach((p) => {
          p.x += p.vx + mx * 0.15;
          p.y += p.vy;
          p.a += 0.02;
          if (p.y < -5) {
            p.y = H + 5;
            p.x = Math.random() * W;
          }
          if (p.x < -5) p.x = W + 5;
          if (p.x > W + 5) p.x = -5;
          g.globalAlpha = 0.25 + Math.sin(p.a) * 0.2;
          g.fillStyle = "#d9b26f";
          g.beginPath();
          g.arc(p.x, p.y, p.r, 0, 6.283);
          g.fill();
        });
        requestAnimationFrame(dust);
      })();

      /* 배경 사운드 */
      let ac,
        master,
        soundOn = false;
      const soundBtn = document.getElementById("sound");
      soundBtn.onclick = () => {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain();
          master.gain.value = 0;
          const lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 650;
          master.connect(lp);
          lp.connect(ac.destination);
          [110, 164.81, 220, 277.18, 329.63, 440].forEach((f, i) => {
            const o = ac.createOscillator();
            o.type = i % 2 ? "sine" : "triangle";
            o.frequency.value = f;
            o.detune.value = (i - 2) * 7;
            const gn = ac.createGain();
            gn.gain.value = 0.1 / (i + 1) + 0.015;
            const l = ac.createOscillator();
            l.frequency.value = 0.05 + i * 0.027;
            const lg = ac.createGain();
            lg.gain.value = 0.025;
            l.connect(lg);
            lg.connect(gn.gain);
            o.connect(gn);
            gn.connect(master);
            o.start();
            l.start();
          });
        }
        soundOn = !soundOn;
        ac.resume();
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.linearRampToValueAtTime(
          soundOn ? 0.55 : 0,
          ac.currentTime + 2,
        );
        soundBtn.classList.toggle("on", soundOn);
      };

      /* 로딩 + 시작 */
      const srcs = [
        ...new Set(
          [...document.querySelectorAll("#stage img")].map((i) => i.src),
        ),
      ];
      let done = 0;
      const lbar = document.getElementById("lbar"),
        lpct = document.getElementById("lpct");
      const tick = () => {
        done++;
        const p = Math.round((done / srcs.length) * 100);
        lbar.style.transform = `scaleX(${p / 100})`;
        lpct.textContent = p + "%";
      };
      const startIdx = (() => {
        const n = parseInt(location.hash.slice(1), 10);
        return n >= 1 && n <= total ? n - 1 : 0;
      })();
      let started = false;
      function begin() {
        if (started) return;
        started = true;
        document.getElementById("loader").classList.add("hide");
        setTimeout(() => goTo(startIdx), 450);
      }
      Promise.all(
        srcs.map(
          (s) =>
            new Promise((r) => {
              const i = new Image();
              i.onload = i.onerror = () => {
                tick();
                r();
              };
              i.src = s;
            }),
        ),
      ).then(() => setTimeout(begin, 500));
      setTimeout(begin, 8000);
    </script>
  </body>
</html>
